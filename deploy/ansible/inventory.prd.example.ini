# Example prd inventory. Copy to `inventory.prd.ini` and fill in real
# hostnames + ssh users. `app_ref` is deliberately unset here — production
# deploys should pin a release SHA or tag via
# `--extra-vars app_ref=<sha_or_tag>` at playbook time, not by editing
# this file.
[rag_hosts]
prd-host-1.internal ansible_user=azureuser

[rag_hosts:vars]
app_dir=/opt/rag-agent
environment_name=prd

[prd:children]
rag_hosts
