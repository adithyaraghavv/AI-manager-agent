---
# Dev overrides. Applied to hosts in the `dev` group (see the
# `[dev:children]` block in inventory.dev.example.ini).

environment_name: dev
log_level: DEBUG
# DATABASE_URL only matters for the one-off Alembic migrations/seed
# scripts — the running app talks to Supabase over its REST API, not this
# URL, in every environment. There's no local Postgres container anymore
# (docker-compose.yml and docker-compose.prod.yml both dropped it — see
# their comments for why); point this at the real Supabase Postgres
# connection string via ansible-vault/ADO if those one-off scripts are
# ever needed against dev, rather than leaving a default that points at a
# host which no longer exists.
