---
# Dev overrides. Applied to hosts in the `dev` group (see the
# `[dev:children]` block in inventory.dev.example.ini).
#
# DATABASE_URL defaults to the compose-internal `db` service so that a
# fresh dev host talks to the pgvector container brought up by the same
# compose stack. Override in ADO / vault if dev points at an external
# managed postgres.

environment_name: dev
log_level: DEBUG
# NOTE: this only matters for the one-off Alembic migrations/seed scripts —
# the running app talks to Supabase over its REST API, not this URL. The
# `db` host below no longer exists in docker-compose.prod.yml (single
# combined service, no local Postgres); run those scripts against a
# reachable Postgres directly if you ever need them here, or ignore this.
database_url: postgresql+psycopg://postgres:postgres@db:5432/rag_agent
