# Example dev inventory. Copy to `inventory.dev.ini` and fill in real
# hostnames + ssh users; the copied file is gitignored by convention (see
# deploy/ansible/.gitignore in follow-ups) because it usually contains
# customer-specific hostnames.
[rag_hosts]
dev-host-1.internal ansible_user=azureuser

[rag_hosts:vars]
app_ref=main
app_dir=/opt/rag-agent
environment_name=dev

[dev:children]
rag_hosts
