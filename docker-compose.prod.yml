# Production stack: ONE service running the combined backend+frontend image
# (see backend/Dockerfile.prod) — no separate frontend container, and no
# local Postgres/migrations service here. The running app talks to Supabase
# over its REST API (SUPABASE_URL / SUPABASE_KEY in the env file below), not
# a direct Postgres connection — DATABASE_URL is only used for the one-off
# Alembic migrations/seed scripts, run manually/separately when needed, not
# as part of bringing the app up.
#
# Used by the Ansible app_deploy role in production (see
# docs/deploy-dev-prd.md and deploy/ansible/roles/app_deploy). Local dev
# keeps using docker-compose.yml, unchanged, for hot-reload.

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
