<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuBot — PM Document Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════
       DESIGN SYSTEM — PM Document Assistant
       Palette: Deep slate blues + amber accent
       ═══════════════════════════════════════════════ */
    :root {
      --bg-base:       #0f1117;
      --bg-surface:    #181d27;
      --bg-elevated:   #1e2534;
      --bg-input:      #252c3d;
      --bg-hover:      #2a3348;

      --border:        #2e3852;
      --border-light:  #374563;

      --accent:        #f59e0b;   /* Amber — PM urgency + authority */
      --accent-dim:    #d97706;
      --accent-glow:   rgba(245, 158, 11, 0.15);

      --blue:          #3b82f6;
      --blue-dim:      #2563eb;
      --blue-glow:     rgba(59, 130, 246, 0.12);

      --green:         #10b981;
      --green-glow:    rgba(16, 185, 129, 0.15);
      --red:           #ef4444;
      --red-glow:      rgba(239, 68, 68, 0.12);

      --text-primary:  #f0f4ff;
      --text-secondary:#8b9dc3;
      --text-muted:    #4d5f82;

      --user-bubble:   #1d3a6e;
      --user-border:   #2d5099;
      --bot-bubble:    #1e2534;

      --sidebar-w:     280px;
      --input-h:       60px;
      --radius:        12px;
      --radius-sm:     8px;
      --radius-lg:     16px;

      --font:          'Inter', system-ui, sans-serif;
      --font-mono:     'JetBrains Mono', monospace;

      --shadow:        0 4px 24px rgba(0,0,0,0.4);
      --shadow-sm:     0 2px 8px rgba(0,0,0,0.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #root {
      height: 100%;
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ═══ LAYOUT ═══ */
    .app-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ═══ SIDEBAR ═══ */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #fb923c);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 42px;
    }

    .sidebar-section {
      padding: 12px 16px 8px;
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .sidebar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }

    .sidebar-btn:hover, .sidebar-btn.active {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .sidebar-btn.active {
      background: var(--accent-glow);
      color: var(--accent);
    }

    .sidebar-btn-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }

    .doc-type-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 16px 12px;
    }

    .doc-pill {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.15s;
    }

    .doc-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      box-shadow: 0 0 6px var(--green);
    }

    .status-text {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ═══ MAIN CHAT AREA ═══ */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ── Top Bar ── */
    .chat-topbar {
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-badge {
      font-size: 10px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      border-radius: 20px;
      padding: 2px 8px;
      font-weight: 600;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-light);
    }

    /* ── Messages ── */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .messages-container::-webkit-scrollbar { width: 4px; }
    .messages-container::-webkit-scrollbar-track { background: transparent; }
    .messages-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Message Rows ── */
    .msg-row {
      display: flex;
      gap: 10px;
      padding: 4px 0;
      max-width: 800px;
      width: 100%;
    }

    .msg-row.user { margin-left: auto; flex-direction: row-reverse; }
    .msg-row.bot  { margin-right: auto; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-top: 2px;
    }

    .avatar.bot {
      background: linear-gradient(135deg, var(--blue), #8b5cf6);
      font-size: 14px;
    }

    .avatar.user {
      background: linear-gradient(135deg, var(--accent), #fb923c);
      font-size: 12px;
      font-weight: 700;
      color: #000;
    }

    .bubble-wrap { display: flex; flex-direction: column; gap: 4px; max-width: calc(100% - 44px); }
    .msg-row.user .bubble-wrap { align-items: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.65;
      position: relative;
    }

    .bubble.user {
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      border-bottom-right-radius: 4px;
      color: var(--text-primary);
    }

    .bubble.bot {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Markdown inside bubbles */
    .bubble strong { color: var(--text-primary); font-weight: 600; }
    .bubble code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: rgba(0,0,0,0.3);
      padding: 1px 5px;
      border-radius: 4px;
      color: #7dd3fc;
    }
    .bubble ul, .bubble ol {
      padding-left: 18px;
      margin: 4px 0;
    }
    .bubble li { margin: 2px 0; }
    .bubble p { margin: 0 0 4px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h4 { font-size: 13px; font-weight: 600; margin: 6px 0 4px; }

    .msg-time {
      font-size: 10px;
      color: var(--text-muted);
      padding: 0 2px;
    }

    /* ── Action Cards ── */
    .action-card {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-base);
    }

    .action-card-header {
      padding: 10px 14px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .action-card-body { padding: 12px 14px; }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--green);
      color: #fff;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
      border: none;
      cursor: pointer;
    }

    .download-btn:hover { background: #059669; transform: translateY(-1px); box-shadow: 0 4px 12px var(--green-glow); }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      margin-top: 4px;
    }

    .template-card {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .template-card:hover {
      border-color: var(--blue);
      background: var(--blue-glow);
    }

    .template-card-icon { font-size: 20px; margin-bottom: 4px; }
    .template-card-type {
      font-size: 13px;
      font-weight: 700;
      color: var(--blue);
    }
    .template-card-name {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Typing Indicator ── */
    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typing-bounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* ── Welcome Screen ── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 32px 20px;
      gap: 24px;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent), #fb923c);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 32px rgba(245, 158, 11, 0.3);
    }

    .welcome-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .welcome-sub {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 400px;
      line-height: 1.7;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 420px;
    }

    .quick-btn {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .quick-btn:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: var(--text-primary);
    }

    .quick-btn-icon { font-size: 18px; }
    .quick-btn-label { font-weight: 600; font-size: 13px; }
    .quick-btn-desc { font-size: 11px; color: var(--text-muted); }

    /* ── Input Area ── */
    .input-area {
      padding: 12px 20px 16px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 8px 8px 14px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font);
      resize: none;
      min-height: 22px;
      max-height: 120px;
      line-height: 1.5;
    }

    .chat-input::placeholder { color: var(--text-muted); }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .attach-btn, .send-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.15s;
    }

    .attach-btn {
      background: transparent;
      color: var(--text-muted);
    }
    .attach-btn:hover {
      background: var(--bg-hover);
      color: var(--text-secondary);
    }

    .send-btn {
      background: var(--accent);
      color: #000;
    }
    .send-btn:hover { background: var(--accent-dim); }
    .send-btn:disabled { background: var(--bg-elevated); color: var(--text-muted); cursor: not-allowed; }

    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      text-align: center;
    }

    /* ── Upload Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ── Drop Zone ── */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg-base);
    }

    .drop-zone.dragging {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .drop-zone:hover { border-color: var(--border-light); }

    .drop-icon { font-size: 28px; margin-bottom: 8px; }
    .drop-text { font-size: 14px; color: var(--text-secondary); }
    .drop-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .selected-file {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .selected-file-name { font-size: 13px; color: var(--text-primary); flex: 1; font-weight: 500; }
    .selected-file-size { font-size: 11px; color: var(--text-muted); }
    .remove-file { cursor: pointer; color: var(--text-muted); font-size: 16px; }
    .remove-file:hover { color: var(--red); }

    /* ── Form Fields ── */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }

    .field input, .field select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus, .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .field select option { background: var(--bg-elevated); }

    /* ── Buttons ── */
    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: var(--font);
      transition: all 0.15s;
    }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-dim); }
    .btn-primary:disabled { background: var(--bg-elevated); color: var(--text-muted); cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
      z-index: 200;
      max-width: 340px;
      animation: slide-in 0.3s ease;
    }

    .toast.success { border-color: var(--green); }
    .toast.error   { border-color: var(--red); }

    @keyframes slide-in {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }

    /* ── Scrollbar ── */
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .quick-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { useState, useEffect, useRef, useCallback } from "https://esm.sh/react@18";
import { createRoot } from "https://esm.sh/react-dom@18/client";
import htm from "https://esm.sh/htm@3";

const html = htm.bind(React.createElement);

const BASE_URL = "http://localhost:8000/api";

// ────────────────────────────────────────────────────────────
// API LAYER
// ────────────────────────────────────────────────────────────
const api = {
  async chat(message, history, sessionId) {
    const r = await fetch(`${BASE_URL}/chat/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, conversation_history: history, session_id: sessionId }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || "Chat error");
    return r.json();
  },

  async getTemplates() {
    const r = await fetch(`${BASE_URL}/templates/`);
    return r.json();
  },

  async uploadDocument(file, clientName, docType) {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("client_name", clientName);
    fd.append("document_type", docType);
    const r = await fetch(`${BASE_URL}/upload/`, { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || "Upload failed");
    return r.json();
  },

  downloadUrl(filename) {
    return `${BASE_URL}/templates/download/${filename}`;
  }
};

// ────────────────────────────────────────────────────────────
// MARKDOWN RENDERER (lightweight)
// ────────────────────────────────────────────────────────────
function renderMd(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/^• (.+)/gm, "<li>$1</li>")
    .replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>")
    .replace(/\n\n/g, "</p><p>")
    .replace(/\n/g, "<br>");
}

// ────────────────────────────────────────────────────────────
// TYPING INDICATOR
// ────────────────────────────────────────────────────────────
function TypingIndicator() {
  return html`
    <div class="msg-row bot">
      <div class="avatar bot">🤖</div>
      <div class="bubble-wrap">
        <div class="bubble bot">
          <div class="typing-bubble">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>
    </div>`;
}

// ────────────────────────────────────────────────────────────
// TEMPLATE GRID CARD
// ────────────────────────────────────────────────────────────
function TemplateCard({ tpl, onDownload }) {
  const icons = { SOW:"📋", FRD:"📐", HLD:"🏗️", LLD:"🔩", BRD:"💼", MSA:"🤝" };
  const icon = icons[tpl.document_type] || "📄";
  return html`
    <div class="template-card" onClick=${() => onDownload(tpl)}>
      <div class="template-card-icon">${icon}</div>
      <div class="template-card-type">${tpl.document_type}</div>
      <div class="template-card-name">${tpl.name || tpl.filename}</div>
    </div>`;
}

// ────────────────────────────────────────────────────────────
// MESSAGE BUBBLE
// ────────────────────────────────────────────────────────────
function MessageBubble({ msg, onTemplateDownload, onUploadRequest }) {
  const isUser = msg.role === "user";
  const time = msg.timestamp
    ? new Date(msg.timestamp).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })
    : "";

  return html`
    <div class="msg-row ${isUser ? "user" : "bot"}">
      ${!isUser && html`<div class="avatar bot">🤖</div>`}
      ${isUser  && html`<div class="avatar user">ME</div>`}

      <div class="bubble-wrap">
        <div class="bubble ${isUser ? "user" : "bot"}"
          dangerouslySetInnerHTML=${{ __html: renderMd(msg.content) }}>
        </div>

        ${/* Download action card */
          msg.action === "download" && msg.download_url && html`
            <div class="action-card">
              <div class="action-card-header">
                📄 Template Ready
              </div>
              <div class="action-card-body">
                <a class="download-btn" href="${BASE_URL.replace('/api','')}/api${msg.download_url.startsWith('/api') ? msg.download_url.slice(4) : msg.download_url}" download>
                  ⬇️ Download ${msg.document_type || "Template"}
                </a>
                <p style="margin-top:10px;font-size:12px;color:var(--text-muted)">
                  After editing, click the upload button to store your completed document.
                </p>
              </div>
            </div>
          `}

        ${/* Template list grid */
          msg.action === "list_templates" && msg.templates && html`
            <div class="action-card">
              <div class="action-card-header">📋 Available Templates</div>
              <div class="action-card-body">
                <div class="template-grid">
                  ${msg.templates.map(t => html`
                    <${TemplateCard}
                      key=${t.filename}
                      tpl=${t}
                      onDownload=${onTemplateDownload}
                    />`
                  )}
                </div>
              </div>
            </div>
          `}

        ${/* Upload prompt */
          msg.action === "upload_prompt" && html`
            <div class="action-card">
              <div class="action-card-header">📤 Upload Document</div>
              <div class="action-card-body">
                <button class="download-btn" style="background:var(--blue)" onClick=${onUploadRequest}>
                  📎 Open Upload Dialog
                </button>
              </div>
            </div>
          `}

        <span class="msg-time">${time}</span>
      </div>
    </div>`;
}

// ────────────────────────────────────────────────────────────
// UPLOAD MODAL
// ────────────────────────────────────────────────────────────
function UploadModal({ onClose, onSuccess }) {
  const [file, setFile] = useState(null);
  const [client, setClient] = useState("");
  const [docType, setDocType] = useState("SOW");
  const [dragging, setDragging] = useState(false);
  const [uploading, setUploading] = useState(false);
  const fileRef = useRef(null);

  const DOC_TYPES = ["SOW","FRD","HLD","LLD","BRD","MSA","OTHER"];

  function handleDrop(e) {
    e.preventDefault();
    setDragging(false);
    const f = e.dataTransfer.files[0];
    if (f) setFile(f);
  }

  async function handleSubmit() {
    if (!file || !client.trim()) return;
    setUploading(true);
    try {
      const result = await api.uploadDocument(file, client, docType);
      onSuccess(result);
    } catch (err) {
      alert("Upload failed: " + err.message);
    } finally {
      setUploading(false);
    }
  }

  const fmtSize = (bytes) =>
    bytes < 1024 ? `${bytes} B`
    : bytes < 1024*1024 ? `${(bytes/1024).toFixed(1)} KB`
    : `${(bytes/1024/1024).toFixed(1)} MB`;

  return html`
    <div class="modal-overlay" onClick=${(e) => e.target.className === "modal-overlay" && onClose()}>
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">📤 Upload Completed Document</div>
          <button class="icon-btn" onClick=${onClose}>✕</button>
        </div>

        <div class="modal-body">
          ${file ? html`
            <div class="selected-file">
              <span>📄</span>
              <span class="selected-file-name">${file.name}</span>
              <span class="selected-file-size">${fmtSize(file.size)}</span>
              <span class="remove-file" onClick=${() => setFile(null)}>✕</span>
            </div>
          ` : html`
            <div
              class="drop-zone ${dragging ? "dragging" : ""}"
              onClick=${() => fileRef.current.click()}
              onDragOver=${(e) => { e.preventDefault(); setDragging(true); }}
              onDragLeave=${() => setDragging(false)}
              onDrop=${handleDrop}
            >
              <div class="drop-icon">📁</div>
              <div class="drop-text">Drag & drop your document here</div>
              <div class="drop-sub">or click to browse — .docx, .pdf, .xlsx, .pptx</div>
              <input
                ref=${fileRef}
                type="file"
                style="display:none"
                accept=".docx,.pdf,.xlsx,.pptx,.doc,.txt"
                onChange=${(e) => setFile(e.target.files[0])}
              />
            </div>
          `}

          <div class="field">
            <label>Client / Project Name *</label>
            <input
              type="text"
              placeholder="e.g. Acme Corporation"
              value=${client}
              onChange=${(e) => setClient(e.target.value)}
            />
          </div>

          <div class="field">
            <label>Document Type *</label>
            <select value=${docType} onChange=${(e) => setDocType(e.target.value)}>
              ${DOC_TYPES.map(t => html`<option key=${t} value=${t}>${t}</option>`)}
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-ghost" onClick=${onClose}>Cancel</button>
          <button
            class="btn btn-primary"
            onClick=${handleSubmit}
            disabled=${!file || !client.trim() || uploading}
          >
            ${uploading ? "Uploading…" : "Store Document"}
          </button>
        </div>
      </div>
    </div>`;
}

// ────────────────────────────────────────────────────────────
// TOAST
// ────────────────────────────────────────────────────────────
function Toast({ msg, type, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 3500);
    return () => clearTimeout(t);
  }, []);
  const icon = type === "success" ? "✅" : "❌";
  return html`<div class="toast ${type}">${icon} ${msg}</div>`;
}

// ────────────────────────────────────────────────────────────
// MAIN APP
// ────────────────────────────────────────────────────────────
function App() {
  const [messages, setMessages]       = useState([]);
  const [input, setInput]             = useState("");
  const [typing, setTyping]           = useState(false);
  const [sessionId, setSessionId]     = useState(null);
  const [showUpload, setShowUpload]   = useState(false);
  const [toast, setToast]             = useState(null);
  const [activeView, setActiveView]   = useState("chat");
  const scrollRef  = useRef(null);
  const inputRef   = useRef(null);
  const DOC_TYPES  = ["SOW","FRD","HLD","LLD","BRD","MSA"];

  // Auto-scroll to bottom on new messages
  useEffect(() => {
    if (scrollRef.current)
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, typing]);

  function showToast(msg, type = "success") {
    setToast({ msg, type });
  }

  // Build conversation history for the API (last 12 messages)
  function buildHistory() {
    return messages.slice(-12).map(m => ({
      role: m.role,
      content: m.content,
    }));
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    const userMsg = {
      role: "user",
      content: text,
      timestamp: new Date().toISOString(),
    };
    setMessages(prev => [...prev, userMsg]);
    setInput("");
    setTyping(true);

    try {
      const data = await api.chat(text, buildHistory(), sessionId);
      if (!sessionId && data.session_id) setSessionId(data.session_id);

      const botMsg = {
        role: "assistant",
        content: data.message,
        action: data.action,
        download_url: data.download_url,
        document_type: data.document_type,
        templates: data.available_templates,
        timestamp: new Date().toISOString(),
      };
      setMessages(prev => [...prev, botMsg]);
    } catch (err) {
      const errMsg = {
        role: "assistant",
        content: `⚠️ **Connection error**: ${err.message}\n\nMake sure the backend is running on port 8000.`,
        timestamp: new Date().toISOString(),
      };
      setMessages(prev => [...prev, errMsg]);
    } finally {
      setTyping(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input);
    }
  }

  function handleQuickAction(text) {
    sendMessage(text);
  }

  function handleTemplateDownload(tpl) {
    const url = `${BASE_URL}/templates/download/${tpl.filename}`;
    window.open(url, "_blank");
    showToast(`Downloading ${tpl.document_type} template…`);
  }

  function handleUploadSuccess(result) {
    setShowUpload(false);
    showToast(`✅ Stored for ${result.document.client_name} / ${result.document.document_type}`);
    const botMsg = {
      role: "assistant",
      content: `✅ **Document stored successfully!**\n\n📁 Saved to \`Clients/${result.document.client_name}/${result.document.document_type}/\`\n\nFile: \`${result.document.filename}\`\n\nIs there anything else you need?`,
      timestamp: new Date().toISOString(),
    };
    setMessages(prev => [...prev, botMsg]);
  }

  function clearChat() {
    setMessages([]);
    setSessionId(null);
  }

  const hasMessages = messages.length > 0;

  return html`
    <div class="app-layout">

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <div class="logo-icon">📋</div>
            <span class="logo-text">DocuBot</span>
          </div>
          <div class="logo-sub">PM Document Assistant</div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-label">Navigation</div>
          <button class="sidebar-btn ${activeView==='chat'?'active':''}" onClick=${()=>setActiveView('chat')}>
            <span class="sidebar-btn-icon">💬</span> Chat Assistant
          </button>
          <button class="sidebar-btn ${activeView==='upload'?'active':''}" onClick=${()=>setShowUpload(true)}>
            <span class="sidebar-btn-icon">📤</span> Upload Document
          </button>
          <button class="sidebar-btn" onClick=${()=>sendMessage("list all templates")}>
            <span class="sidebar-btn-icon">📋</span> All Templates
          </button>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-label">Quick Fetch</div>
        </div>
        <div class="doc-type-pills">
          ${DOC_TYPES.map(t => html`
            <button key=${t} class="doc-pill" onClick=${()=>sendMessage(`fetch ${t} template`)}>
              ${t}
            </button>
          `)}
        </div>

        <div class="sidebar-section">
          <div class="sidebar-label">Session</div>
          <button class="sidebar-btn" onClick=${clearChat}>
            <span class="sidebar-btn-icon">🔄</span> New Chat
          </button>
        </div>

        <div class="sidebar-footer">
          <span class="status-dot"></span>
          <span class="status-text">Backend ${sessionId ? 'connected' : 'ready'}</span>
        </div>
      </aside>

      <!-- CHAT AREA -->
      <main class="chat-area">

        <!-- Top Bar -->
        <div class="chat-topbar">
          <div class="topbar-title">
            🤖 DocuBot
            <span class="topbar-badge">AI-Powered</span>
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" onClick=${()=>setShowUpload(true)} title="Upload document">📤</button>
            <button class="icon-btn" onClick=${clearChat} title="Clear chat">🔄</button>
          </div>
        </div>

        <!-- Messages -->
        <div class="messages-container" ref=${scrollRef}>

          ${!hasMessages && html`
            <div class="welcome">
              <div class="welcome-icon">📋</div>
              <h1 class="welcome-title">DocuBot PM Assistant</h1>
              <p class="welcome-sub">
                Manage your project documents in one place.
                Fetch templates, upload completed docs, and organize client files — all through chat.
              </p>
              <div class="quick-actions">
                <button class="quick-btn" onClick=${()=>handleQuickAction("fetch SOW template")}>
                  <span class="quick-btn-icon">📋</span>
                  <span class="quick-btn-label">Fetch SOW</span>
                  <span class="quick-btn-desc">Statement of Work template</span>
                </button>
                <button class="quick-btn" onClick=${()=>handleQuickAction("fetch FRD template")}>
                  <span class="quick-btn-icon">📐</span>
                  <span class="quick-btn-label">Fetch FRD</span>
                  <span class="quick-btn-desc">Functional Requirements</span>
                </button>
                <button class="quick-btn" onClick=${()=>handleQuickAction("list all templates")}>
                  <span class="quick-btn-icon">📋</span>
                  <span class="quick-btn-label">Browse Templates</span>
                  <span class="quick-btn-desc">See all available templates</span>
                </button>
                <button class="quick-btn" onClick=${()=>setShowUpload(true)}>
                  <span class="quick-btn-icon">📤</span>
                  <span class="quick-btn-label">Upload Document</span>
                  <span class="quick-btn-desc">Store completed document</span>
                </button>
              </div>
            </div>
          `}

          ${messages.map((msg, i) => html`
            <${MessageBubble}
              key=${i}
              msg=${msg}
              onTemplateDownload=${handleTemplateDownload}
              onUploadRequest=${()=>setShowUpload(true)}
            />`
          )}

          ${typing && html`<${TypingIndicator} />`}
        </div>

        <!-- Input Area -->
        <div class="input-area">
          <div class="input-row">
            <textarea
              ref=${inputRef}
              class="chat-input"
              rows="1"
              placeholder="Ask me to fetch a template, upload a document, search files…"
              value=${input}
              onInput=${(e) => {
                setInput(e.target.value);
                e.target.style.height = "auto";
                e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
              }}
              onKeyDown=${handleKeyDown}
            ></textarea>
            <div class="input-actions">
              <button class="attach-btn" onClick=${()=>setShowUpload(true)} title="Upload document">
                📎
              </button>
              <button
                class="send-btn"
                onClick=${()=>sendMessage(input)}
                disabled=${!input.trim() || typing}
              >
                ↑
              </button>
            </div>
          </div>
          <div class="input-hint">
            Enter to send • Shift+Enter for new line • 📎 to upload files
          </div>
        </div>
      </main>

      <!-- UPLOAD MODAL -->
      ${showUpload && html`
        <${UploadModal}
          onClose=${()=>setShowUpload(false)}
          onSuccess=${handleUploadSuccess}
        />`
      }

      <!-- TOAST -->
      ${toast && html`
        <${Toast}
          msg=${toast.msg}
          type=${toast.type}
          onDone=${()=>setToast(null)}
        />`
      }
    </div>`;
}

// Mount
const root = createRoot(document.getElementById("root"));
root.render(html`<${App} />`);
</script>
</body>
</html>
