<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarBot — PM Document Assistant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-base:      #F8FAFC;
      --bg-surface:   #FFFFFF;
      --bg-elevated:  #F1F5F9;
      --bg-input:     #F8FAFC;
      --bg-hover:     #E2E8F0;

      --border:       #E2E8F0;
      --border-light: #CBD5E1;

      --accent:       #1D4ED8;
      --accent-dim:   #1E40AF;
      --accent-glow:  rgba(29, 78, 216, 0.08);

      --blue:         #2563EB;
      --blue-light:   #EFF6FF;
      --blue-glow:    rgba(37, 99, 235, 0.10);

      --green:        #10B981;
      --green-glow:   rgba(16, 185, 129, 0.12);
      --red:          #EF4444;

      --text-primary:   #111827;
      --text-secondary: #374151;
      --text-muted:     #9CA3AF;

      --user-bubble:  #1D4ED8;
      --user-border:  #1E40AF;
      --bot-bubble:   #F1F5F9;
      --bot-border:   #E2E8F0;

      --sidebar-bg:   #1E3A8A;
      --sidebar-text: #BFDBFE;
      --sidebar-muted:#93C5FD;
      --sidebar-active: rgba(255,255,255,0.12);
      --sidebar-hover:  rgba(255,255,255,0.08);

      --sidebar-w: 268px;
      --radius:    12px;
      --radius-sm: 8px;
      --radius-lg: 16px;

      --font:      'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow:    0 2px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.14);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #root {
      height: 100%;
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Layout ───────────────────────────────── */
    .app-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 3px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #60A5FA, #3B82F6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.3px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--sidebar-muted);
      margin-left: 44px;
    }

    .sidebar-section {
      padding: 12px 16px 6px;
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sidebar-muted);
      margin-bottom: 6px;
    }

    .sidebar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--sidebar-text);
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }

    .sidebar-btn:hover { background: var(--sidebar-hover); color: #fff; }
    .sidebar-btn.active { background: var(--sidebar-active); color: #fff; }

    .sidebar-btn-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }

    .doc-type-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 16px 12px;
    }

    .doc-pill {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.20);
      background: transparent;
      color: var(--sidebar-text);
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.15s;
    }

    .doc-pill:hover {
      border-color: #60A5FA;
      color: #fff;
      background: rgba(96,165,250,0.15);
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.10);
    }

    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      box-shadow: 0 0 6px var(--green);
    }

    .status-text { font-size: 11px; color: var(--sidebar-muted); }

    /* ── Chat Area ────────────────────────────── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      background: var(--bg-base);
    }

    .chat-topbar {
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      flex-shrink: 0;
      box-shadow: 0 1px 0 var(--border);
    }

    .topbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-badge {
      font-size: 10px;
      background: var(--blue-light);
      color: var(--blue);
      border: 1px solid #BFDBFE;
      border-radius: 20px;
      padding: 2px 8px;
      font-weight: 600;
    }

    .topbar-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--border-light);
    }

    /* ── Messages ─────────────────────────────── */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .messages-container::-webkit-scrollbar { width: 4px; }
    .messages-container::-webkit-scrollbar-track { background: transparent; }
    .messages-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-row {
      display: flex;
      gap: 10px;
      padding: 4px 0;
      max-width: 820px;
      width: 100%;
    }

    .msg-row.user { margin-left: auto; flex-direction: row-reverse; }
    .msg-row.bot  { margin-right: auto; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-top: 2px;
    }

    .avatar.bot  { background: linear-gradient(135deg, var(--blue), #6366F1); font-size: 14px; }
    .avatar.user { background: var(--accent); font-size: 11px; font-weight: 700; color: #fff; }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: calc(100% - 44px);
    }

    .msg-row.user .bubble-wrap { align-items: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.65;
    }

    .bubble.user {
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    .bubble.bot {
      background: var(--bot-bubble);
      border: 1px solid var(--bot-border);
      border-bottom-left-radius: 4px;
      color: var(--text-primary);
    }

    .bubble strong { font-weight: 600; }
    .bubble.bot strong { color: var(--accent); }
    .bubble.user strong { color: #BFDBFE; }

    .bubble code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: rgba(0,0,0,0.07);
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--blue);
    }

    .bubble ul, .bubble ol { padding-left: 18px; margin: 4px 0; }
    .bubble li  { margin: 2px 0; }
    .bubble p   { margin: 0 0 4px; }
    .bubble p:last-child { margin-bottom: 0; }

    .msg-time { font-size: 10px; color: var(--text-muted); padding: 0 2px; }

    /* ── Action Cards ─────────────────────────── */
    .action-card {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-surface);
      box-shadow: var(--shadow);
    }

    .action-card-header {
      padding: 9px 14px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .action-card-body { padding: 12px 14px; }

    /* ── Buttons ──────────────────────────────── */
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
      border: none;
      cursor: pointer;
    }

    .download-btn:hover {
      background: var(--accent-dim);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--blue-glow);
    }

    .download-btn.green { background: var(--green); }
    .download-btn.green:hover { background: #059669; }

    /* ── Template Grid ────────────────────────── */
    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      margin-top: 4px;
    }

    .template-card {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      background: var(--bg-surface);
    }

    .template-card:hover {
      border-color: var(--blue);
      background: var(--blue-light);
      box-shadow: var(--shadow);
    }

    .template-card-icon  { font-size: 22px; margin-bottom: 5px; }
    .template-card-type  { font-size: 12px; font-weight: 700; color: var(--blue); }
    .template-card-name  { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    /* ── Client Cards ─────────────────────────── */
    .client-list { display: flex; flex-direction: column; gap: 10px; }

    .client-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      overflow: hidden;
    }

    .client-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--blue-light);
      border-bottom: 1px solid #BFDBFE;
      cursor: pointer;
      user-select: none;
    }

    .client-card-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      color: var(--accent);
    }

    .client-card-badge {
      font-size: 11px;
      background: var(--accent);
      color: #fff;
      border-radius: 20px;
      padding: 2px 8px;
      font-weight: 600;
    }

    .client-docs-list {
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .client-doc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      gap: 8px;
    }

    .client-doc-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .client-doc-icon { font-size: 16px; flex-shrink: 0; }

    .client-doc-name {
      font-size: 12px;
      color: var(--text-primary);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .client-doc-meta { font-size: 10px; color: var(--text-muted); }

    .client-doc-download {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .client-doc-download:hover { background: var(--accent-dim); }

    .no-docs-msg {
      font-size: 12px;
      color: var(--text-muted);
      padding: 8px 0;
      font-style: italic;
    }

    /* ── Typing ───────────────────────────────── */
    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
    }

    .typing-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typing-bounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%            { transform: translateY(-4px); opacity: 1; }
    }

    /* ── Welcome Screen ───────────────────────── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 32px 20px;
      gap: 20px;
    }

    .welcome-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--blue), #6366F1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 24px var(--blue-glow);
    }

    .welcome-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .welcome-sub {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 420px;
      line-height: 1.7;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 440px;
    }

    .quick-btn {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 3px;
      box-shadow: var(--shadow);
    }

    .quick-btn:hover {
      border-color: var(--blue);
      background: var(--blue-light);
      color: var(--text-primary);
    }

    .quick-btn-icon  { font-size: 18px; }
    .quick-btn-label { font-weight: 600; font-size: 13px; color: var(--text-primary); }
    .quick-btn-desc  { font-size: 11px; color: var(--text-muted); }

    /* ── Input Area ───────────────────────────── */
    .input-area {
      padding: 12px 20px 16px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg-input);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 8px 8px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-row:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-glow);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font);
      resize: none;
      min-height: 22px;
      max-height: 120px;
      line-height: 1.5;
    }

    .chat-input::placeholder { color: var(--text-muted); }

    .input-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

    .attach-btn, .send-btn {
      width: 34px; height: 34px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.15s;
    }

    .attach-btn { background: transparent; color: var(--text-muted); }
    .attach-btn:hover { background: var(--bg-hover); color: var(--text-secondary); }

    .send-btn { background: var(--accent); color: #fff; }
    .send-btn:hover { background: var(--accent-dim); }
    .send-btn:disabled { background: var(--bg-elevated); color: var(--text-muted); cursor: not-allowed; }

    .input-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; }

    /* ── Modal ────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 490px;
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .modal-body  { padding: 20px; display: flex; flex-direction: column; gap: 14px; }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .drop-zone {
      border: 2px dashed var(--border-light);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg-elevated);
    }

    .drop-zone.dragging { border-color: var(--blue); background: var(--blue-light); }
    .drop-zone:hover    { border-color: var(--blue); }

    .drop-icon { font-size: 28px; margin-bottom: 8px; }
    .drop-text { font-size: 14px; color: var(--text-secondary); }
    .drop-sub  { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .selected-file {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--blue-light);
      border-radius: var(--radius-sm);
      border: 1px solid #BFDBFE;
    }

    .selected-file-name { font-size: 13px; color: var(--text-primary); flex: 1; font-weight: 500; }
    .selected-file-size { font-size: 11px; color: var(--text-muted); }
    .remove-file { cursor: pointer; color: var(--text-muted); font-size: 16px; }
    .remove-file:hover { color: var(--red); }

    .field { display: flex; flex-direction: column; gap: 5px; }

    .field label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }

    .field input,
    .field select {
      background: var(--bg-input);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-glow);
    }

    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: var(--font);
      transition: all 0.15s;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dim); }
    .btn-primary:disabled { background: var(--bg-elevated); color: var(--text-muted); cursor: not-allowed; }

    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

    /* ── Toast ────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      max-width: 340px;
      animation: slide-in 0.3s ease;
    }

    .toast.success { border-color: var(--green); }
    .toast.error   { border-color: var(--red); }

    @keyframes slide-in {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }

    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    @media (max-width: 640px) {
      .sidebar { display: none; }
      .quick-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect, useRef, useMemo } from "https://esm.sh/react@18?dev";
    import { createRoot } from "https://esm.sh/react-dom@18/client?dev";
    import htm from "https://esm.sh/htm@3";

    const html = htm.bind(React.createElement);
    const BASE_URL = "http://localhost:8000/api";

    // ── API client ──────────────────────────────────────────────────────────
    const api = {
      async chat(message, history, sessionId) {
        const res = await fetch(`${BASE_URL}/chat/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, conversation_history: history, session_id: sessionId }),
        });
        if (!res.ok) {
          let detail = "Chat error";
          try { detail = (await res.json()).detail || detail; } catch (_) {}
          throw new Error(detail);
        }
        return res.json();
      },

      async getTemplates() {
        const res = await fetch(`${BASE_URL}/templates/`);
        if (!res.ok) throw new Error("Failed to load templates");
        return res.json();
      },

      async uploadDocument(file, clientName, documentType) {
        const fd = new FormData();
        fd.append("file", file);
        fd.append("client_name", clientName);
        fd.append("project_name", clientName);
        fd.append("document_type", documentType);
        const res = await fetch(`${BASE_URL}/upload/`, { method: "POST", body: fd });
        if (!res.ok) {
          let detail = "Upload failed";
          try { detail = (await res.json()).detail || detail; } catch (_) {}
          throw new Error(detail);
        }
        return res.json();
      },
    };

    // ── Helpers ─────────────────────────────────────────────────────────────
    function escapeHtml(v) {
      return String(v)
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function renderMd(text = "") {
      const safe = escapeHtml(text);
      return "<p>" + safe
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>")
        .replace(/^•\s(.+)$/gm, "<li>$1</li>")
        .replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>")
        .replace(/\n\n/g, "</p><p>")
        .replace(/\n/g, "<br>") + "</p>";
    }

    function normalizeType(v) {
      return String(v || "").toLowerCase()
        .replace(/_/g, " ").replace(/template/g, "")
        .replace(/[^a-z0-9]+/g, " ").trim();
    }

    function displayDocType(v) {
      const n = normalizeType(v);
      if (n === "frd") return "FRD";
      if (n === "hld") return "HLD";
      if (n === "lld") return "LLD";
      if (n.includes("data management")) return "Data Management Plan";
      if (n.includes("software requirements") || n === "srs") return "Software Requirements";
      // For dynamic template names, format the raw value nicely
      return v ? String(v).replace(/_/g, " ") : "Template";
    }

    function getDocIcon(type) {
      const k = normalizeType(type);
      if (k.includes("frd") || k.includes("functional")) return "📐";
      if (k.includes("hld") || k.includes("high level")) return "🏗️";
      if (k.includes("lld") || k.includes("low level")) return "🔩";
      if (k.includes("data management") || k.includes("dmp")) return "🗂️";
      if (k.includes("software") || k.includes("srs") || k.includes("requirements")) return "📝";
      return "📄";
    }

    function getFileIcon(ext) {
      switch ((ext || "").toLowerCase()) {
        case ".docx": case ".doc": return "📝";
        case ".pdf":  return "📕";
        case ".xlsx": case ".xls": return "📊";
        case ".pptx": case ".ppt": return "📑";
        default:      return "📄";
      }
    }

    function resolveUrl(url) {
      if (!url) return "#";
      if (url.startsWith("http://") || url.startsWith("https://")) return url;
      return `http://localhost:8000${url}`;
    }

    function fmtSize(kb) {
      if (!kb && kb !== 0) return "";
      if (kb < 1024) return `${kb} KB`;
      return `${(kb / 1024).toFixed(1)} MB`;
    }

    // ── Components ──────────────────────────────────────────────────────────

    function TypingIndicator() {
      return html`
        <div className="msg-row bot">
          <div className="avatar bot">🤖</div>
          <div className="bubble-wrap">
            <div className="bubble bot">
              <div className="typing-bubble">
                <div className="typing-dot"></div>
                <div className="typing-dot"></div>
                <div className="typing-dot"></div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function TemplateCard({ tpl, onDownload }) {
      return html`
        <div className="template-card" onClick=${() => onDownload(tpl)}>
          <div className="template-card-icon">${getDocIcon(tpl.document_type || tpl.name)}</div>
          <div className="template-card-type">${displayDocType(tpl.document_type || tpl.name)}</div>
          <div className="template-card-name">${tpl.size_kb ? fmtSize(tpl.size_kb) : ""}</div>
        </div>`;
    }

    function ClientDocRow({ doc }) {
      const url = resolveUrl(doc.download_url);
      return html`
        <div className="client-doc-row">
          <div className="client-doc-info">
            <span className="client-doc-icon">${getFileIcon(doc.extension)}</span>
            <div>
              <div className="client-doc-name" title=${doc.filename}>
                ${doc.display_name || doc.filename}
              </div>
              <div className="client-doc-meta">${fmtSize(doc.size_kb)} ${doc.extension}</div>
            </div>
          </div>
          <a className="client-doc-download" href=${url} download=${doc.filename}>
            ⬇ Download
          </a>
        </div>`;
    }

    function ClientCard({ client }) {
      const [expanded, setExpanded] = useState(true);
      return html`
        <div className="client-card">
          <div className="client-card-header" onClick=${() => setExpanded(e => !e)}>
            <div className="client-card-name">
              👤 ${client.client_name}
              <span style=${{ fontSize: "11px", color: "var(--text-muted)", fontWeight: 400 }}>
                (${client.folder_name})
              </span>
            </div>
            <div style=${{ display: "flex", alignItems: "center", gap: "8px" }}>
              <span className="client-card-badge">
                ${client.document_count} ${client.document_count === 1 ? "doc" : "docs"}
              </span>
              <span style=${{ color: "var(--accent)", fontSize: "12px" }}>
                ${expanded ? "▲" : "▼"}
              </span>
            </div>
          </div>
          ${expanded && html`
            <div className="client-docs-list">
              ${client.documents && client.documents.length > 0
                ? client.documents.map((doc, i) => html`
                    <${ClientDocRow} key=${i} doc=${doc} />
                  `)
                : html`<div className="no-docs-msg">No documents stored yet.</div>`
              }
            </div>
          `}
        </div>`;
    }

    function MessageBubble({ msg, onTemplateDownload, onUploadRequest }) {
      const isUser = msg.role === "user";
      const time = msg.timestamp
        ? new Date(msg.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        : "";

      const downloadUrl = resolveUrl(msg.download_url);

      return html`
        <div className="msg-row ${isUser ? "user" : "bot"}">
          ${!isUser && html`<div className="avatar bot">🤖</div>`}
          ${isUser  && html`<div className="avatar user">ME</div>`}

          <div className="bubble-wrap">
            <div
              className="bubble ${isUser ? "user" : "bot"}"
              dangerouslySetInnerHTML=${{ __html: renderMd(msg.content) }}
            ></div>

            ${msg.action === "download" && msg.download_url && html`
              <div className="action-card">
                <div className="action-card-header">📄 Template Ready</div>
                <div className="action-card-body">
                  <a className="download-btn green" href=${downloadUrl} download>
                    ⬇️ Download ${displayDocType(msg.document_type)}
                  </a>
                  <p style=${{ marginTop: "10px", fontSize: "12px", color: "var(--text-muted)" }}>
                    After filling it out, come back and upload the completed document.
                  </p>
                </div>
              </div>
            `}

            ${msg.action === "list_templates" && Array.isArray(msg.templates) && msg.templates.length > 0 && html`
              <div className="action-card">
                <div className="action-card-header">📋 Available Templates (${msg.templates.length})</div>
                <div className="action-card-body">
                  <div className="template-grid">
                    ${msg.templates.map((tpl, i) => html`
                      <${TemplateCard}
                        key=${i}
                        tpl=${tpl}
                        onDownload=${onTemplateDownload}
                      />
                    `)}
                  </div>
                </div>
              </div>
            `}

            ${(msg.action === "list_clients" || msg.action === "client_documents")
              && Array.isArray(msg.clients) && html`
              <div className="action-card">
                <div className="action-card-header">
                  ${msg.action === "client_documents" ? "📁 Client Documents" : "👥 Active Clients"}
                  ${msg.clients.length > 0 ? ` (${msg.clients.length})` : ""}
                </div>
                <div className="action-card-body">
                  ${msg.clients.length > 0
                    ? html`
                        <div className="client-list">
                          ${msg.clients.map((c, i) => html`
                            <${ClientCard} key=${i} client=${c} />
                          `)}
                        </div>
                      `
                    : html`
                        <p style=${{ fontSize: "13px", color: "var(--text-muted)" }}>
                          No client folders found yet. Upload completed documents to create client folders.
                        </p>
                      `
                  }
                </div>
              </div>
            `}

            ${msg.action === "upload_prompt" && html`
              <div className="action-card">
                <div className="action-card-header">📤 Upload Document</div>
                <div className="action-card-body">
                  <button
                    className="download-btn"
                    onClick=${onUploadRequest}
                  >
                    📎 Open Upload Dialog
                  </button>
                </div>
              </div>
            `}

            ${msg.action === "search_results" && Array.isArray(msg.templates) && html`
              <div className="action-card">
                <div className="action-card-header">🔍 Search Results (${msg.templates.length})</div>
                <div className="action-card-body">
                  ${msg.templates.length > 0
                    ? html`
                        <div className="client-list">
                          ${msg.templates.map((doc, i) => html`
                            <${ClientDocRow} key=${i} doc=${doc} />
                          `)}
                        </div>
                      `
                    : html`<p style=${{ fontSize: "13px", color: "var(--text-muted)" }}>No results found.</p>`
                  }
                </div>
              </div>
            `}

            <span className="msg-time">${time}</span>
          </div>
        </div>`;
    }

    // ── Upload Modal ─────────────────────────────────────────────────────────
    function UploadModal({ onClose, onSuccess, docTypeOptions }) {
      const [file, setFile]       = useState(null);
      const [client, setClient]   = useState("");
      const [docType, setDocType] = useState(docTypeOptions[0] || "");
      const [customType, setCustomType] = useState("");
      const [dragging, setDragging] = useState(false);
      const [uploading, setUploading] = useState(false);
      const fileRef = useRef(null);

      useEffect(() => {
        if (!docType && docTypeOptions.length > 0) setDocType(docTypeOptions[0]);
      }, [docTypeOptions]);

      function handleDrop(e) {
        e.preventDefault();
        setDragging(false);
        const f = e.dataTransfer.files[0];
        if (f) setFile(f);
      }

      async function handleSubmit() {
        const effectiveType = docType === "__custom__" ? customType.trim() : docType;
        if (!file || !client.trim() || !effectiveType) return;
        setUploading(true);
        try {
          const result = await api.uploadDocument(file, client.trim(), effectiveType);
          onSuccess(result);
        } catch (err) {
          alert("Upload failed: " + err.message);
        } finally {
          setUploading(false);
        }
      }

      const fmtBytes = (b) =>
        b < 1024 ? `${b} B`
        : b < 1024 * 1024 ? `${(b / 1024).toFixed(1)} KB`
        : `${(b / 1048576).toFixed(1)} MB`;

      const isReady = file && client.trim() && (docType !== "__custom__" ? !!docType : !!customType.trim());

      return html`
        <div
          className="modal-overlay"
          onClick=${(e) => e.target.className === "modal-overlay" && onClose()}
        >
          <div className="modal">
            <div className="modal-header">
              <div className="modal-title">📤 Upload Completed Document</div>
              <button className="icon-btn" onClick=${onClose}>✕</button>
            </div>

            <div className="modal-body">
              ${file ? html`
                <div className="selected-file">
                  <span>📄</span>
                  <span className="selected-file-name">${file.name}</span>
                  <span className="selected-file-size">${fmtBytes(file.size)}</span>
                  <span className="remove-file" onClick=${() => setFile(null)}>✕</span>
                </div>
              ` : html`
                <div
                  className="drop-zone ${dragging ? "dragging" : ""}"
                  onClick=${() => fileRef.current.click()}
                  onDragOver=${(e) => { e.preventDefault(); setDragging(true); }}
                  onDragLeave=${() => setDragging(false)}
                  onDrop=${handleDrop}
                >
                  <div className="drop-icon">📁</div>
                  <div className="drop-text">Drag & drop your document here</div>
                  <div className="drop-sub">or click to browse — .docx, .pdf, .xlsx, .pptx</div>
                  <input
                    ref=${fileRef}
                    type="file"
                    style=${{ display: "none" }}
                    accept=".docx,.pdf,.xlsx,.pptx,.doc,.txt"
                    onChange=${(e) => setFile(e.target.files[0])}
                  />
                </div>
              `}

              <div className="field">
                <label>Client / Project Name *</label>
                <input
                  type="text"
                  placeholder="e.g. Project Alpha"
                  value=${client}
                  onChange=${(e) => setClient(e.target.value)}
                />
              </div>

              <div className="field">
                <label>Document Type *</label>
                <select value=${docType} onChange=${(e) => setDocType(e.target.value)}>
                  ${docTypeOptions.length > 0
                    ? docTypeOptions.map(t => html`<option key=${t} value=${t}>${displayDocType(t)}</option>`)
                    : html`<option value="">— No templates loaded —</option>`
                  }
                  <option value="__custom__">Other (custom type)</option>
                </select>
              </div>

              ${docType === "__custom__" && html`
                <div className="field">
                  <label>Custom Document Type *</label>
                  <input
                    type="text"
                    placeholder="e.g. UAT Test Plan"
                    value=${customType}
                    onChange=${(e) => setCustomType(e.target.value)}
                  />
                </div>
              `}
            </div>

            <div className="modal-footer">
              <button className="btn btn-ghost" onClick=${onClose}>Cancel</button>
              <button
                className="btn btn-primary"
                onClick=${handleSubmit}
                disabled=${!isReady || uploading}
              >
                ${uploading ? "Uploading…" : "Store Document"}
              </button>
            </div>
          </div>
        </div>`;
    }

    // ── Toast ────────────────────────────────────────────────────────────────
    function Toast({ msg, type, onDone }) {
      useEffect(() => {
        const t = setTimeout(onDone, 3500);
        return () => clearTimeout(t);
      }, [onDone]);
      return html`
        <div className="toast ${type}">
          ${type === "success" ? "✅" : "❌"} ${msg}
        </div>`;
    }

    // ── App ──────────────────────────────────────────────────────────────────
    function App() {
      const [messages, setMessages]     = useState([]);
      const [input, setInput]           = useState("");
      const [typing, setTyping]         = useState(false);
      const [sessionId, setSessionId]   = useState(null);
      const [showUpload, setShowUpload] = useState(false);
      const [toast, setToast]           = useState(null);
      const [templates, setTemplates]   = useState([]);
      const [templatesLoading, setTemplatesLoading] = useState(false);

      const scrollRef = useRef(null);
      const inputRef  = useRef(null);

      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
      }, [messages, typing]);

      useEffect(() => { loadTemplates(); }, []);

      async function loadTemplates() {
        setTemplatesLoading(true);
        try {
          const data = await api.getTemplates();
          const list = Array.isArray(data) ? data
                     : Array.isArray(data.templates) ? data.templates
                     : [];
          setTemplates(list);
        } catch (err) {
          console.error("Failed to load templates:", err);
          showToast("Could not load templates from backend", "error");
        } finally {
          setTemplatesLoading(false);
        }
      }

      const templateTypes = useMemo(
        () => [...new Set(templates.map(t => t.document_type).filter(Boolean))],
        [templates]
      );

      const quickActionTemplates = useMemo(() => templateTypes.slice(0, 3), [templateTypes]);

      function showToast(msg, type = "success") { setToast({ msg, type }); }

      function buildHistory() {
        return messages.slice(-12).map(m => ({ role: m.role, content: m.content }));
      }

      async function sendMessage(text) {
        if (!text.trim()) return;
        const userMsg = { role: "user", content: text, timestamp: new Date().toISOString() };
        setMessages(prev => [...prev, userMsg]);
        setInput("");
        setTyping(true);

        try {
          const data = await api.chat(text, buildHistory(), sessionId);
          if (!sessionId && data.session_id) setSessionId(data.session_id);

          const botMsg = {
            role: "assistant",
            content:      data.message || "Done.",
            action:       data.action,
            download_url: data.download_url,
            document_type: data.document_type,
            templates:    data.available_templates || [],
            clients:      data.clients || [],
            timestamp:    new Date().toISOString(),
          };
          setMessages(prev => [...prev, botMsg]);
        } catch (err) {
          setMessages(prev => [...prev, {
            role: "assistant",
            content: `⚠️ **Connection error**: ${err.message}\n\nMake sure the backend is running on port 8000.`,
            timestamp: new Date().toISOString(),
          }]);
        } finally {
          setTyping(false);
        }
      }

      function handleKeyDown(e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(input); }
      }

      function handleTemplateDownload(tpl) {
        const url = resolveUrl(
          tpl.download_url || `/api/templates/download/${encodeURIComponent(tpl.filename)}`
        );
        window.open(url, "_blank");
        showToast(`Downloading ${displayDocType(tpl.document_type || tpl.name)} template…`);
      }

      function handleUploadSuccess(result) {
        setShowUpload(false);
        const doc = result.document || result;
        const client = doc.client_name || doc.project_name || "Unknown";
        const dtype  = displayDocType(doc.document_type || "Document");
        const fname  = doc.filename || "uploaded-file";
        showToast(`Stored for ${client} / ${dtype}`);
        setMessages(prev => [...prev, {
          role: "assistant",
          content: `✅ **Document stored successfully!**\n\n📁 Saved under \`${client}/${dtype}/\`\n\nFile: \`${fname}\`\n\nIs there anything else you need?`,
          timestamp: new Date().toISOString(),
        }]);
      }

      function clearChat() { setMessages([]); setSessionId(null); }

      const hasMessages = messages.length > 0;

      return html`
        <div className="app-layout">

          <!-- Sidebar -->
          <aside className="sidebar">
            <div className="sidebar-header">
              <div className="logo">
                <div className="logo-icon">📋</div>
                <span className="logo-text">MarBot</span>
              </div>
              <div className="logo-sub">PM Document Assistant</div>
            </div>

            <div className="sidebar-section">
              <div className="sidebar-label">Navigation</div>
              <button className="sidebar-btn" onClick=${() => sendMessage("list all templates")}>
                <span className="sidebar-btn-icon">📋</span>All Templates
              </button>
              <button className="sidebar-btn" onClick=${() => sendMessage("list clients")}>
                <span className="sidebar-btn-icon">👥</span>List Clients
              </button>
              <button className="sidebar-btn" onClick=${() => { setShowUpload(true); }}>
                <span className="sidebar-btn-icon">📤</span>Upload Document
              </button>
            </div>

            <div className="sidebar-section">
              <div className="sidebar-label">Quick Fetch</div>
            </div>
            <div className="doc-type-pills">
              ${templateTypes.length > 0
                ? templateTypes.map(t => html`
                    <button key=${t} className="doc-pill"
                      onClick=${() => sendMessage(`fetch ${displayDocType(t)} template`)}>
                      ${displayDocType(t)}
                    </button>
                  `)
                : html`<span className="status-text">${templatesLoading ? "Loading…" : "No templates"}</span>`
              }
            </div>

            <div className="sidebar-section">
              <div className="sidebar-label">Session</div>
              <button className="sidebar-btn" onClick=${clearChat}>
                <span className="sidebar-btn-icon">🔄</span>New Chat
              </button>
            </div>

            <div className="sidebar-footer">
              <span className="status-dot"></span>
              <span className="status-text">
                Backend ${sessionId ? "connected" : "ready"}
              </span>
            </div>
          </aside>

          <!-- Chat area -->
          <main className="chat-area">
            <div className="chat-topbar">
              <div className="topbar-title">
                🤖 MarBot
                <span className="topbar-badge">AI-Powered</span>
              </div>
              <div className="topbar-actions">
                <button className="icon-btn" onClick=${() => setShowUpload(true)} title="Upload">📤</button>
                <button className="icon-btn" onClick=${clearChat} title="New chat">🔄</button>
              </div>
            </div>

            <div className="messages-container" ref=${scrollRef}>
              ${!hasMessages && html`
                <div className="welcome">
                  <div className="welcome-icon">📋</div>
                  <h1 className="welcome-title">MarBot PM Assistant</h1>
                  <p className="welcome-sub">
                    Manage your project documents in one place. Fetch templates,
                    upload completed docs, and browse client files — all through chat.
                  </p>
                  <div className="quick-actions">
                    ${quickActionTemplates.map(t => html`
                      <button key=${t} className="quick-btn"
                        onClick=${() => sendMessage(`fetch ${displayDocType(t)} template`)}>
                        <span className="quick-btn-icon">${getDocIcon(t)}</span>
                        <span className="quick-btn-label">Fetch ${displayDocType(t)}</span>
                        <span className="quick-btn-desc">Download template</span>
                      </button>
                    `)}
                    <button className="quick-btn" onClick=${() => sendMessage("list clients")}>
                      <span className="quick-btn-icon">👥</span>
                      <span className="quick-btn-label">List Clients</span>
                      <span className="quick-btn-desc">View stored documents</span>
                    </button>
                    <button className="quick-btn" onClick=${() => setShowUpload(true)}>
                      <span className="quick-btn-icon">📤</span>
                      <span className="quick-btn-label">Upload Document</span>
                      <span className="quick-btn-desc">Store completed doc</span>
                    </button>
                  </div>
                </div>
              `}

              ${messages.map((m, i) => html`
                <${MessageBubble}
                  key=${i}
                  msg=${m}
                  onTemplateDownload=${handleTemplateDownload}
                  onUploadRequest=${() => setShowUpload(true)}
                />
              `)}

              ${typing && html`<${TypingIndicator} />`}
            </div>

            <div className="input-area">
              <div className="input-row">
                <textarea
                  ref=${inputRef}
                  className="chat-input"
                  rows="1"
                  placeholder="Ask me to fetch a template, list clients, or upload a document…"
                  value=${input}
                  onInput=${(e) => {
                    setInput(e.target.value);
                    e.target.style.height = "auto";
                    e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
                  }}
                  onKeyDown=${handleKeyDown}
                ></textarea>
                <div className="input-actions">
                  <button className="attach-btn" onClick=${() => setShowUpload(true)} title="Upload">📎</button>
                  <button className="send-btn" onClick=${() => sendMessage(input)} disabled=${!input.trim() || typing}>↑</button>
                </div>
              </div>
              <div className="input-hint">Enter to send • Shift+Enter for new line • 📎 to upload</div>
            </div>
          </main>

          ${showUpload && html`
            <${UploadModal}
              onClose=${() => setShowUpload(false)}
              onSuccess=${handleUploadSuccess}
              docTypeOptions=${templateTypes}
            />
          `}

          ${toast && html`
            <${Toast} msg=${toast.msg} type=${toast.type} onDone=${() => setToast(null)} />
          `}
        </div>`;
    }

    createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
