<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarBot — PM Document Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:        #0B1F5B;
      --navy:       #1F3C88;
      --sky:        #00AEEF;
      --sky-dim:    #0099d6;
      --sky-glow:   rgba(0,174,239,0.13);
      --sky-tint:   #E8F6FD;

      --mist:       #F5F7FA;
      --white:      #FFFFFF;
      --fog:        #EEF2F8;

      --steel:      #8A9BB8;
      --border:     #DDE3EE;
      --border-mid: #C4CEDF;

      --text:       #111827;
      --text-2:     #374151;
      --text-3:     #6B7280;

      --user-bg:    #1F3C88;
      --bot-bg:     #F5F7FA;

      --sidebar-w:  252px;
      --sidebar-text: #B8CAE8;
      --sidebar-muted:#6D87B4;
      --sidebar-hover: rgba(255,255,255,0.065);
      --sidebar-active: rgba(0,174,239,0.16);

      --green:  #10B981;
      --red:    #EF4444;

      --r:    8px;
      --r-sm: 6px;
      --r-lg: 12px;
      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'SF Mono', 'Cascadia Code', 'Fira Mono', monospace;

      --shadow:    0 1px 10px rgba(11,31,91,0.07);
      --shadow-md: 0 4px 20px rgba(11,31,91,0.11);
      --shadow-lg: 0 8px 32px rgba(11,31,91,0.16);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; font-family: var(--font); background: var(--mist); color: var(--text); font-size: 14px; line-height: 1.6; }

    /* ─── Layout ─────────────────────────────────────────────── */
    .app { display: flex; height: 100vh; overflow: hidden; }

    /* ─── Sidebar ─────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--ink);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-head {
      padding: 16px 14px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 30px; height: 30px;
      border-radius: 7px;
      background: var(--sky);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: #fff;
    }

    .logo-name  { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -0.2px; }
    .logo-sub   { font-size: 10px; color: var(--sidebar-muted); font-weight: 400; }

    /* nav section */
    .sb-section { padding: 10px 10px 0; }

    .nav-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 7px 10px;
      border: none;
      background: transparent;
      color: var(--sidebar-muted);
      font: 600 10px/1 var(--font);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: var(--r-sm);
      transition: background 0.15s, color 0.15s;
      margin-bottom: 2px;
    }
    .nav-toggle:hover { background: var(--sidebar-hover); color: var(--sidebar-text); }
    .nav-toggle-left  { display: flex; align-items: center; gap: 7px; }

    .nav-chevron { transition: transform 0.22s ease; color: var(--sidebar-muted); }
    .nav-chevron.open { transform: rotate(180deg); }

    .nav-items {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.25s ease, opacity 0.2s ease;
    }
    .nav-items.open { max-height: 220px; opacity: 1; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 7px 10px 7px 22px;
      border: none;
      background: transparent;
      color: var(--sidebar-text);
      font: 400 12.5px/1.4 var(--font);
      cursor: pointer;
      border-radius: var(--r-sm);
      transition: background 0.12s, color 0.12s;
      text-align: left;
    }
    .nav-item:hover  { background: var(--sidebar-hover); color: #fff; }
    .nav-item:focus-visible { outline: 2px solid var(--sky); outline-offset: -2px; }
    .nav-item svg { opacity: 0.65; flex-shrink: 0; }
    .nav-item:hover svg { opacity: 1; }

    /* quick fetch */
    .sb-label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--sidebar-muted);
      padding: 10px 14px 4px;
    }

    .pill-row { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 14px 10px; }

    .pill {
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      border: 1px solid rgba(0,174,239,0.28);
      background: transparent;
      color: var(--sidebar-text);
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.13s;
    }
    .pill:hover { border-color: var(--sky); color: var(--sky); background: rgba(0,174,239,0.08); }

    .sb-spacer { flex: 1; }

    .sb-foot {
      padding: 10px 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .sb-foot-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 7px 8px;
      border: none; background: transparent;
      color: var(--sidebar-text); font: 400 12.5px var(--font);
      cursor: pointer; border-radius: var(--r-sm);
      transition: background 0.13s, color 0.13s;
    }
    .sb-foot-btn:hover { background: var(--sidebar-hover); color: #fff; }

    /* ─── Chat Area ───────────────────────────────────────────── */
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-width: 0; background: var(--mist);
    }

    /* Topbar */
    .topbar {
      height: 52px; padding: 0 18px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      box-shadow: 0 1px 0 var(--border);
      gap: 12px;
    }

    .topbar-brand {
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    .topbar-title { font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
    .topbar-sep   { width: 1px; height: 16px; background: var(--border); }
    .topbar-badge {
      font-size: 10px; font-weight: 600;
      color: var(--sky); background: var(--sky-tint);
      border: 1px solid rgba(0,174,239,0.22);
      border-radius: 20px; padding: 2px 8px;
      white-space: nowrap;
    }

    /* Command search trigger (center) */
    .cmd-trigger {
      display: flex; align-items: center; gap: 8px;
      flex: 1; max-width: 380px; margin: 0 auto;
      padding: 6px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      background: var(--mist);
      color: var(--text-3);
      font: 400 12px var(--font);
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .cmd-trigger:hover { border-color: var(--sky); }
    .cmd-trigger:focus-visible { outline: none; border-color: var(--sky); box-shadow: 0 0 0 3px var(--sky-glow); }

    .cmd-trigger-text { flex: 1; text-align: left; }
    .cmd-shortcut {
      font-size: 10px; background: var(--fog);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 1px 5px; color: var(--text-3); white-space: nowrap;
    }

    /* Topbar icon buttons */
    .topbar-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

    .ico-btn {
      width: 30px; height: 30px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.13s;
    }
    .ico-btn:hover { background: var(--fog); color: var(--ink); border-color: var(--border-mid); }
    .ico-btn:focus-visible { outline: 2px solid var(--sky); outline-offset: 1px; }

    /* ─── Command Palette ─────────────────────────────────────── */
    .cmd-overlay {
      position: fixed; inset: 0;
      background: rgba(11,31,91,0.28);
      backdrop-filter: blur(3px);
      z-index: 500;
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 72px;
    }

    .cmd-panel {
      width: min(560px, 92vw);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .cmd-search {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .cmd-input {
      flex: 1; border: none; outline: none;
      background: transparent;
      font: 400 14px var(--font); color: var(--text);
    }
    .cmd-input::placeholder { color: var(--text-3); }

    .cmd-esc {
      font-size: 10px; background: var(--fog);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 1px 5px; color: var(--text-3);
    }

    .cmd-section-label {
      padding: 8px 14px 3px;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-3);
    }

    .cmd-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cmd-item:hover, .cmd-item.focused { background: var(--sky-tint); }

    .cmd-item-icon {
      width: 30px; height: 30px;
      background: var(--fog); border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--navy);
      transition: background 0.1s, color 0.1s;
    }
    .cmd-item:hover .cmd-item-icon,
    .cmd-item.focused .cmd-item-icon { background: rgba(0,174,239,0.12); color: var(--sky); }

    .cmd-item-label { font-size: 13px; font-weight: 500; color: var(--text); }
    .cmd-item-sub   { font-size: 11px; color: var(--text-3); margin-top: 1px; }

    .cmd-empty { padding: 24px; text-align: center; font-size: 13px; color: var(--text-3); }

    .cmd-footer {
      padding: 7px 14px;
      border-top: 1px solid var(--border);
      display: flex; gap: 14px;
      font-size: 10px; color: var(--text-3);
    }
    .cmd-key { display: inline-flex; align-items: center; gap: 4px; }
    .cmd-kbd { background: var(--fog); border: 1px solid var(--border); border-radius: 3px; padding: 1px 4px; font-size: 9px; }

    /* ─── Messages ────────────────────────────────────────────── */
    .msgs {
      flex: 1; overflow-y: auto;
      padding: 20px; display: flex; flex-direction: column; gap: 3px;
    }
    .msgs::-webkit-scrollbar { width: 4px; }
    .msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-row {
      display: flex; gap: 9px; padding: 3px 0;
      max-width: 800px; width: 100%;
    }
    .msg-row.user { margin-left: auto; flex-direction: row-reverse; }
    .msg-row.bot  { margin-right: auto; }

    .avatar {
      width: 27px; height: 27px; border-radius: 6px;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      margin-top: 3px;
    }
    .avatar.bot  { background: var(--ink); color: var(--sky); }
    .avatar.user { background: var(--sky); color: #fff; }

    .bubble-wrap {
      display: flex; flex-direction: column; gap: 4px;
      max-width: calc(100% - 40px);
    }
    .msg-row.user .bubble-wrap { align-items: flex-end; }

    .bubble {
      padding: 9px 13px;
      border-radius: var(--r);
      font-size: 13.5px; line-height: 1.65;
    }
    .bubble.user {
      background: var(--user-bg); border: 1px solid #162e6e;
      border-bottom-right-radius: 3px; color: #fff;
    }
    .bubble.bot {
      background: var(--white); border: 1px solid var(--border);
      border-bottom-left-radius: 3px; color: var(--text);
    }
    .bubble strong        { font-weight: 600; }
    .bubble.bot strong    { color: var(--ink); }
    .bubble.user strong   { color: #b8d4f8; }
    .bubble code {
      font-family: var(--mono); font-size: 11.5px;
      background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px;
    }
    .bubble ul, .bubble ol { padding-left: 18px; margin: 3px 0; }
    .bubble li  { margin: 2px 0; }
    .bubble p   { margin: 0 0 4px; }
    .bubble p:last-child { margin-bottom: 0; }

    .msg-time { font-size: 10px; color: var(--text-3); padding: 0 1px; }

    /* Typing */
    .typing-dots { display: flex; align-items: center; gap: 4px; padding: 11px 14px; }
    .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--steel); animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.35; }
      30%          { transform: translateY(-4px); opacity: 1; }
    }

    /* ─── Action Cards ────────────────────────────────────────── */
    .card {
      margin-top: 7px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .card-head {
      padding: 8px 13px;
      background: var(--ink);
      display: flex; align-items: center; gap: 7px;
      font-size: 10.5px; font-weight: 600;
      color: rgba(255,255,255,0.80);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .card-head svg { opacity: 0.7; }

    .card-body { padding: 13px; }

    /* ─── Buttons ─────────────────────────────────────────────── */
    .dl-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 15px;
      background: var(--sky); color: #fff;
      border: none; border-radius: var(--r-sm);
      font: 600 12px var(--font);
      text-decoration: none; cursor: pointer;
      transition: background 0.14s, box-shadow 0.14s;
    }
    .dl-btn:hover { background: var(--sky-dim); box-shadow: 0 3px 10px rgba(0,174,239,0.32); }
    .dl-btn.dark  { background: var(--ink); }
    .dl-btn.dark:hover { background: var(--navy); box-shadow: 0 3px 10px rgba(11,31,91,0.3); }

    /* ─── Template Grid ───────────────────────────────────────── */
    .tpl-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 7px; margin-top: 2px;
    }

    .tpl-card {
      padding: 11px; border: 1px solid var(--border);
      border-radius: var(--r-sm); cursor: pointer;
      transition: all 0.14s; text-align: center;
      background: var(--white); overflow: hidden;
      position: relative;
    }
    .tpl-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px; background: var(--sky); opacity: 0;
      transition: opacity 0.14s;
    }
    .tpl-card:hover { border-color: var(--sky); box-shadow: var(--shadow); }
    .tpl-card:hover::before { opacity: 1; }

    .tpl-icon {
      width: 32px; height: 32px;
      background: var(--fog); border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 7px; color: var(--navy);
      transition: background 0.14s, color 0.14s;
    }
    .tpl-card:hover .tpl-icon { background: var(--sky-tint); color: var(--sky); }

    .tpl-type { font-size: 11.5px; font-weight: 700; color: var(--ink); }
    .tpl-size { font-size: 10px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }

    /* ─── Client Cards ────────────────────────────────────────── */
    .client-list { display: flex; flex-direction: column; gap: 7px; }

    .client-card { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--white); overflow: hidden; }

    .client-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 13px;
      background: var(--fog); border-bottom: 1px solid var(--border);
      cursor: pointer; user-select: none;
    }
    .client-name {
      display: flex; align-items: center; gap: 8px;
      font: 600 13px var(--font); color: var(--ink);
    }
    .client-folder { font-size: 11px; color: var(--text-3); font-weight: 400; }
    .client-badge {
      font-size: 10px; font-weight: 600;
      background: var(--sky); color: #fff;
      border-radius: 20px; padding: 2px 7px;
    }

    .doc-list { padding: 8px 12px; display: flex; flex-direction: column; gap: 5px; }

    .doc-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; border: 1px solid var(--border);
      border-radius: var(--r-sm); background: var(--mist); gap: 8px;
    }

    .doc-info { display: flex; align-items: center; gap: 8px; min-width: 0; }

    .doc-icon {
      width: 26px; height: 26px;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 5px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--navy);
    }

    .doc-name {
      font-size: 12px; font-weight: 500; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px;
    }
    .doc-meta { font-size: 10px; color: var(--text-3); font-variant-numeric: tabular-nums; }

    .doc-dl {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 9px; background: var(--sky); color: #fff;
      border-radius: 5px; font: 600 11px var(--font);
      text-decoration: none; flex-shrink: 0; transition: background 0.13s;
    }
    .doc-dl:hover { background: var(--sky-dim); }

    .no-docs { font-size: 12px; color: var(--text-3); padding: 6px 0; font-style: italic; }

    /* ─── Welcome ─────────────────────────────────────────────── */
    .welcome {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; flex: 1;
      text-align: center; padding: 32px 20px; gap: 18px;
    }

    .welcome-mark {
      width: 56px; height: 56px;
      background: var(--ink); border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: var(--sky); box-shadow: 0 8px 24px rgba(11,31,91,0.2);
    }

    .welcome-title {
      font-size: 20px; font-weight: 700; color: var(--ink);
      letter-spacing: -0.4px; text-wrap: balance;
    }

    .welcome-sub {
      font-size: 13px; color: var(--text-2);
      max-width: 380px; line-height: 1.7;
    }

    .quick-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 8px; width: 100%; max-width: 400px;
    }

    .quick-btn {
      padding: 11px 13px;
      border: 1.5px solid var(--border); border-radius: var(--r);
      background: var(--white); color: var(--text-2);
      font: 400 12.5px var(--font); cursor: pointer;
      transition: all 0.14s; text-align: left;
      display: flex; flex-direction: column; gap: 3px;
      box-shadow: var(--shadow);
    }
    .quick-btn:hover { border-color: var(--sky); background: var(--sky-tint); }
    .quick-btn-icon {
      width: 26px; height: 26px;
      background: var(--fog); border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      color: var(--sky); margin-bottom: 2px;
      transition: background 0.14s;
    }
    .quick-btn:hover .quick-btn-icon { background: rgba(0,174,239,0.14); }
    .quick-btn-label { font-weight: 600; font-size: 12.5px; color: var(--ink); }
    .quick-btn-desc  { font-size: 10.5px; color: var(--text-3); }

    /* ─── Input ───────────────────────────────────────────────── */
    .input-area {
      padding: 10px 18px 13px;
      background: var(--white); border-top: 1px solid var(--border); flex-shrink: 0;
    }

    .input-row {
      display: flex; align-items: flex-end; gap: 7px;
      background: var(--mist); border: 1.5px solid var(--border);
      border-radius: var(--r); padding: 7px 7px 7px 13px;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .input-row:focus-within { border-color: var(--sky); box-shadow: 0 0 0 3px var(--sky-glow); }

    .chat-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font: 400 13.5px var(--font);
      resize: none; min-height: 22px; max-height: 120px; line-height: 1.5;
    }
    .chat-input::placeholder { color: var(--text-3); }

    .input-actions { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }

    .attach-btn, .send-btn {
      width: 31px; height: 31px; border-radius: var(--r-sm);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.13s;
    }
    .attach-btn { background: transparent; color: var(--text-3); }
    .attach-btn:hover { background: var(--fog); color: var(--text-2); }

    .send-btn { background: var(--sky); color: #fff; }
    .send-btn:hover { background: var(--sky-dim); }
    .send-btn:disabled { background: var(--fog); color: var(--text-3); cursor: not-allowed; }

    .input-hint { font-size: 10.5px; color: var(--text-3); margin-top: 5px; text-align: center; }

    /* ─── Modal ───────────────────────────────────────────────── */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(11,31,91,0.3); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 300; padding: 20px;
    }
    .modal {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--r-lg); width: 100%; max-width: 470px;
      box-shadow: var(--shadow-lg);
    }
    .modal-head {
      padding: 13px 16px; border-radius: var(--r-lg) var(--r-lg) 0 0;
      background: var(--ink); display: flex; align-items: center;
      justify-content: space-between;
    }
    .modal-title { font: 700 13.5px var(--font); color: #fff; display: flex; align-items: center; gap: 8px; }
    .modal-close {
      background: transparent; border: none; color: rgba(255,255,255,0.5);
      cursor: pointer; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; transition: all 0.13s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .modal-body   { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-footer { padding: 11px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 7px; }

    .drop-zone {
      border: 2px dashed var(--border-mid); border-radius: var(--r);
      padding: 26px 20px; text-align: center; cursor: pointer;
      transition: all 0.18s; background: var(--fog);
    }
    .drop-zone:hover, .drop-zone.drag { border-color: var(--sky); background: var(--sky-tint); }
    .drop-ico { width: 40px; height: 40px; background: var(--white); border: 1px solid var(--border); border-radius: 9px; display: flex; align-items: center; justify-content: center; margin: 0 auto 9px; color: var(--sky); }
    .drop-text { font-size: 13px; font-weight: 500; color: var(--text-2); }
    .drop-sub  { font-size: 11px; color: var(--text-3); margin-top: 3px; }

    .sel-file {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px; background: var(--sky-tint);
      border-radius: var(--r-sm); border: 1px solid rgba(0,174,239,0.22);
    }
    .sel-file-name { font-size: 13px; color: var(--text); flex: 1; font-weight: 500; }
    .sel-file-size { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .rm-file { cursor: pointer; color: var(--text-3); display: flex; align-items: center; transition: color 0.13s; }
    .rm-file:hover { color: var(--red); }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font: 600 11.5px var(--font); color: var(--text-2); }
    .field input, .field select {
      background: var(--mist); border: 1.5px solid var(--border);
      border-radius: var(--r-sm); padding: 7px 11px;
      color: var(--text); font: 400 13px var(--font); outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus {
      border-color: var(--sky); box-shadow: 0 0 0 3px var(--sky-glow);
    }

    .btn {
      padding: 7px 15px; border-radius: var(--r-sm);
      font: 600 12.5px var(--font); cursor: pointer; border: none;
      transition: all 0.13s;
    }
    .btn-primary { background: var(--sky); color: #fff; }
    .btn-primary:hover { background: var(--sky-dim); }
    .btn-primary:disabled { background: var(--fog); color: var(--text-3); cursor: not-allowed; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-2); }
    .btn-ghost:hover { background: var(--fog); color: var(--text); }

    /* ─── Toast ───────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 18px; right: 18px;
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--r); padding: 9px 14px;
      font-size: 12.5px; display: flex; align-items: center; gap: 9px;
      box-shadow: var(--shadow-lg); z-index: 600; max-width: 300px;
      animation: slide-in 0.22s ease;
    }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error   { border-left: 3px solid var(--red); }
    .toast-ico { flex-shrink: 0; }
    .toast.success .toast-ico { color: var(--green); }
    .toast.error   .toast-ico { color: var(--red); }
    @keyframes slide-in {
      from { transform: translateX(110%); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }

    /* ─── Misc ────────────────────────────────────────────────── */
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    @media (max-width: 640px) {
      .sidebar, .cmd-trigger { display: none; }
      .quick-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import React, { useState, useEffect, useRef, useMemo } from "https://esm.sh/react@18?dev";
  import { createRoot } from "https://esm.sh/react-dom@18/client?dev";
  import htm from "https://esm.sh/htm@3";

  const html = htm.bind(React.createElement);
  const BASE = "http://localhost:8000/api";

  // ── SVG Icons ──────────────────────────────────────────────────────────────
  const I = {
    doc:      (s=15) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
    grid:     (s=15) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`,
    db:       (s=15) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>`,
    users:    (s=15) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
    upload:   (s=15) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
    download: (s=15) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
    search:   (s=15) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
    menu:     (s=15) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>`,
    chev:     (s=13) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
    x:        (s=13) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
    send:     (s=14) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
    refresh:  (s=14) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-5"/></svg>`,
    clip:     (s=14) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>`,
    bot:      (s=13) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><circle cx="8.5" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="16" r="1" fill="currentColor" stroke="none"/></svg>`,
    user:     (s=13) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
    check:    (s=13) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
    alert:    (s=13) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  };

  // ── API ────────────────────────────────────────────────────────────────────
  const api = {
    async chat(message, history, sessionId) {
      const res = await fetch(`${BASE}/chat/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, conversation_history: history, session_id: sessionId }),
      });
      if (!res.ok) { let d = "Chat error"; try { d = (await res.json()).detail || d; } catch(_){} throw new Error(d); }
      return res.json();
    },
    async getTemplates() {
      const res = await fetch(`${BASE}/templates/`);
      if (!res.ok) throw new Error("Failed to load templates");
      return res.json();
    },
    async uploadDocument(file, clientName, documentType) {
      const fd = new FormData();
      fd.append("file", file); fd.append("client_name", clientName);
      fd.append("project_name", clientName); fd.append("document_type", documentType);
      const res = await fetch(`${BASE}/upload/`, { method: "POST", body: fd });
      if (!res.ok) { let d = "Upload failed"; try { d = (await res.json()).detail || d; } catch(_){} throw new Error(d); }
      return res.json();
    },
  };

  // ── Helpers ────────────────────────────────────────────────────────────────
  function escHtml(v) {
    return String(v)
      .replaceAll("&","&amp;").replaceAll("<","&lt;")
      .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function renderMd(text = "") {
    const safe = escHtml(text);
    return "<p>" + safe
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`(.+?)`/g, "<code>$1</code>")
      .replace(/^•\s(.+)$/gm, "<li>$1</li>")
      .replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>")
      .replace(/\n\n/g, "</p><p>")
      .replace(/\n/g, "<br>") + "</p>";
  }

  function normType(v) {
    return String(v||"").toLowerCase().replace(/_/g," ").replace(/template/g,"").replace(/[^a-z0-9]+/g," ").trim();
  }

  function dispType(v) {
    const n = normType(v);
    if (n==="frd"||n.includes("functional req")) return "FRD";
    if (n==="hld"||n.includes("high level"))     return "HLD";
    if (n==="lld"||n.includes("low level"))      return "LLD";
    if (n.includes("data management"))            return "Data Mgmt Plan";
    if (n.includes("software req")||n==="srs")   return "SRS";
    return v ? String(v).replace(/_/g," ") : "Template";
  }

  function docIcon(type, s=15) {
    const k = normType(type);
    if (k.includes("hld")||k.includes("high level")) return I.grid(s);
    if (k.includes("dmp")||k.includes("data mgmt")||k.includes("data management")) return I.db(s);
    return I.doc(s);
  }

  function resolveUrl(url) {
    if (!url) return "#";
    if (url.startsWith("http://") || url.startsWith("https://")) return url;
    return `http://localhost:8000${url}`;
  }

  function fmtSize(kb) {
    if (!kb && kb !== 0) return "";
    return kb < 1024 ? `${kb} KB` : `${(kb/1024).toFixed(1)} MB`;
  }

  // ── Command Palette Data ───────────────────────────────────────────────────
  const ACTIONS = [
    { id:"tpls",  label:"List All Templates",   sub:"Browse available document templates",   icon:"doc",    msg:"list all templates" },
    { id:"clts",  label:"List Clients",          sub:"See all clients with stored documents", icon:"users",  msg:"list clients" },
    { id:"upld",  label:"Upload Document",       sub:"Store a completed doc for a client",    icon:"upload", action:"upload" },
    { id:"frd",   label:"Fetch FRD Template",    sub:"Functional Requirements Document",      icon:"doc",    msg:"FRD" },
    { id:"hld",   label:"Fetch HLD Template",    sub:"High Level Design",                     icon:"grid",   msg:"HLD" },
    { id:"lld",   label:"Fetch LLD Template",    sub:"Low Level Design",                      icon:"doc",    msg:"LLD" },
    { id:"srs",   label:"Fetch SRS Template",    sub:"Software Requirements Specification",   icon:"doc",    msg:"SRS" },
    { id:"dmp",   label:"Fetch Data Mgmt Plan",  sub:"Data Management Plan template",         icon:"db",     msg:"DMP" },
  ];

  // ── Command Palette ────────────────────────────────────────────────────────
  function CmdPalette({ open, onClose, onSend, onUpload, recent }) {
    const [q, setQ] = useState("");
    const [focus, setFocus] = useState(0);
    const inRef = useRef(null);

    useEffect(() => {
      if (open) { setQ(""); setFocus(0); setTimeout(() => inRef.current?.focus(), 40); }
    }, [open]);

    const items = useMemo(() => {
      if (!q.trim()) return ACTIONS;
      const lq = q.toLowerCase();
      return ACTIONS.filter(a => a.label.toLowerCase().includes(lq) || a.sub.toLowerCase().includes(lq));
    }, [q]);

    function run(item) {
      onClose();
      if (item.action === "upload") { onUpload(); return; }
      if (item.msg) onSend(item.msg, item);
    }

    function onKey(e) {
      if (e.key === "ArrowDown") { e.preventDefault(); setFocus(f => Math.min(f+1, items.length-1)); }
      if (e.key === "ArrowUp")   { e.preventDefault(); setFocus(f => Math.max(f-1, 0)); }
      if (e.key === "Escape")    { onClose(); }
      if (e.key === "Enter" && items[focus]) run(items[focus]);
    }

    if (!open) return null;

    return html`
      <div className="cmd-overlay" onClick=${onClose}>
        <div className="cmd-panel" onClick=${e => e.stopPropagation()}>
          <div className="cmd-search">
            ${I.search(15)}
            <input
              ref=${inRef}
              className="cmd-input"
              placeholder="Search actions, templates, clients…"
              value=${q}
              onInput=${e => { setQ(e.target.value); setFocus(0); }}
              onKeyDown=${onKey}
            />
            <span className="cmd-esc">ESC</span>
          </div>

          ${recent.length > 0 && !q && html`
            <div className="cmd-section-label">Recent</div>
            ${recent.slice(0,2).map((a,i) => html`
              <div key=${i} className="cmd-item" onClick=${() => run(a)}>
                <div className="cmd-item-icon">${I[a.icon] ? I[a.icon](13) : I.doc(13)}</div>
                <div>
                  <div className="cmd-item-label">${a.label}</div>
                  <div className="cmd-item-sub">${a.sub}</div>
                </div>
              </div>
            `)}
          `}

          <div className="cmd-section-label">${q ? "Results" : "Actions"}</div>

          ${items.length === 0
            ? html`<div className="cmd-empty">No results for "${q}"</div>`
            : items.map((item,i) => html`
                <div
                  key=${item.id}
                  className=${"cmd-item"+(i===focus?" focused":"")}
                  onClick=${() => run(item)}
                  onMouseEnter=${() => setFocus(i)}
                >
                  <div className="cmd-item-icon">${I[item.icon] ? I[item.icon](13) : I.doc(13)}</div>
                  <div>
                    <div className="cmd-item-label">${item.label}</div>
                    <div className="cmd-item-sub">${item.sub}</div>
                  </div>
                </div>
              `)
          }

          <div className="cmd-footer">
            <span className="cmd-key"><span className="cmd-kbd">↑↓</span> navigate</span>
            <span className="cmd-key"><span className="cmd-kbd">↵</span> select</span>
            <span className="cmd-key"><span className="cmd-kbd">Esc</span> close</span>
          </div>
        </div>
      </div>`;
  }

  // ── Sidebar Nav ────────────────────────────────────────────────────────────
  function SidebarNav({ onSend, onUpload }) {
    const [open, setOpen] = useState(true);
    return html`
      <div className="sb-section">
        <button
          className="nav-toggle"
          onClick=${() => setOpen(o => !o)}
          aria-expanded=${open}
          aria-controls="nav-items"
        >
          <span className="nav-toggle-left">${I.menu(12)} Navigation</span>
          <span className=${"nav-chevron"+(open?" open":"")}>${I.chev(11)}</span>
        </button>
        <div className=${"nav-items"+(open?" open":"")} id="nav-items" role="menu">
          <button className="nav-item" role="menuitem" onClick=${() => onSend("list all templates")}>
            ${I.doc(13)} All Templates
          </button>
          <button className="nav-item" role="menuitem" onClick=${() => onSend("list clients")}>
            ${I.users(13)} List Clients
          </button>
          <button className="nav-item" role="menuitem" onClick=${onUpload}>
            ${I.upload(13)} Upload Document
          </button>
        </div>
      </div>`;
  }

  // ── Components ─────────────────────────────────────────────────────────────
  function TypingIndicator() {
    return html`
      <div className="msg-row bot">
        <div className="avatar bot">${I.bot(13)}</div>
        <div className="bubble-wrap">
          <div className="bubble bot">
            <div className="typing-dots">
              <div className="dot"></div><div className="dot"></div><div className="dot"></div>
            </div>
          </div>
        </div>
      </div>`;
  }

  function TplCard({ tpl, onDl }) {
    return html`
      <div className="tpl-card" onClick=${() => onDl(tpl)}>
        <div className="tpl-icon">${docIcon(tpl.document_type || tpl.name, 17)}</div>
        <div className="tpl-type">${dispType(tpl.document_type || tpl.name)}</div>
        <div className="tpl-size">${tpl.size_kb ? fmtSize(tpl.size_kb) : ""}</div>
      </div>`;
  }

  function DocRow({ doc }) {
    const url = resolveUrl(doc.download_url);
    return html`
      <div className="doc-row">
        <div className="doc-info">
          <div className="doc-icon">${I.doc(13)}</div>
          <div>
            <div className="doc-name" title=${doc.filename}>${doc.display_name || doc.filename}</div>
            <div className="doc-meta">${fmtSize(doc.size_kb)} ${doc.extension}</div>
          </div>
        </div>
        <a className="doc-dl" href=${url} download=${doc.filename}>
          ${I.download(11)} Download
        </a>
      </div>`;
  }

  function ClientCard({ client }) {
    const [exp, setExp] = useState(true);
    return html`
      <div className="client-card">
        <div className="client-head" onClick=${() => setExp(e => !e)}>
          <div className="client-name">
            ${I.users(13)} ${client.client_name}
            <span className="client-folder">(${client.folder_name})</span>
          </div>
          <div style=${{ display:"flex", alignItems:"center", gap:"8px" }}>
            <span className="client-badge">
              ${client.document_count} ${client.document_count===1?"doc":"docs"}
            </span>
            <span style=${{ color:"var(--steel)" }}>${I.chev(11)}</span>
          </div>
        </div>
        ${exp && html`
          <div className="doc-list">
            ${client.documents && client.documents.length > 0
              ? client.documents.map((d,i) => html`<${DocRow} key=${i} doc=${d} />`)
              : html`<div className="no-docs">No documents stored yet.</div>`
            }
          </div>
        `}
      </div>`;
  }

  function MsgBubble({ msg, onTplDl, onUpload }) {
    const isUser = msg.role === "user";
    const time = msg.timestamp
      ? new Date(msg.timestamp).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })
      : "";
    const dlUrl = resolveUrl(msg.download_url);

    return html`
      <div className=${"msg-row "+(isUser?"user":"bot")}>
        ${!isUser && html`<div className="avatar bot">${I.bot(13)}</div>`}
        ${isUser  && html`<div className="avatar user">${I.user(13)}</div>`}

        <div className="bubble-wrap">
          <div className=${"bubble "+(isUser?"user":"bot")}
            dangerouslySetInnerHTML=${{ __html: renderMd(msg.content) }}>
          </div>

          ${msg.action==="download" && msg.download_url && html`
            <div className="card">
              <div className="card-head">${I.doc(11)} Template Ready</div>
              <div className="card-body">
                <a className="dl-btn" href=${dlUrl} download>
                  ${I.download(13)} Download ${dispType(msg.document_type)}
                </a>
                <p style=${{ marginTop:"9px", fontSize:"12px", color:"var(--text-3)" }}>
                  After completing it, come back and upload the document.
                </p>
              </div>
            </div>
          `}

          ${msg.action==="list_templates" && Array.isArray(msg.templates) && msg.templates.length > 0 && html`
            <div className="card">
              <div className="card-head">${I.doc(11)} Available Templates (${msg.templates.length})</div>
              <div className="card-body">
                <div className="tpl-grid">
                  ${msg.templates.map((t,i) => html`<${TplCard} key=${i} tpl=${t} onDl=${onTplDl} />`)}
                </div>
              </div>
            </div>
          `}

          ${(msg.action==="list_clients"||msg.action==="client_documents") && Array.isArray(msg.clients) && html`
            <div className="card">
              <div className="card-head">
                ${I.users(11)}
                ${msg.action==="client_documents"?"Client Documents":"Active Clients"}
                ${msg.clients.length>0?` (${msg.clients.length})`:""}
              </div>
              <div className="card-body">
                ${msg.clients.length > 0
                  ? html`<div className="client-list">${msg.clients.map((c,i) => html`<${ClientCard} key=${i} client=${c} />`)}</div>`
                  : html`<p style=${{ fontSize:"12.5px", color:"var(--text-3)" }}>No client folders found. Upload completed documents to create client folders.</p>`
                }
              </div>
            </div>
          `}

          ${msg.action==="upload_prompt" && html`
            <div className="card">
              <div className="card-head">${I.upload(11)} Upload Document</div>
              <div className="card-body">
                <button className="dl-btn dark" onClick=${onUpload}>
                  ${I.upload(13)} Open Upload Dialog
                </button>
              </div>
            </div>
          `}

          ${msg.action==="search_results" && Array.isArray(msg.templates) && html`
            <div className="card">
              <div className="card-head">${I.search(11)} Search Results (${msg.templates.length})</div>
              <div className="card-body">
                ${msg.templates.length > 0
                  ? html`<div className="client-list">${msg.templates.map((d,i) => html`<${DocRow} key=${i} doc=${d} />`)}</div>`
                  : html`<p style=${{ fontSize:"12.5px", color:"var(--text-3)" }}>No results found.</p>`
                }
              </div>
            </div>
          `}

          <span className="msg-time">${time}</span>
        </div>
      </div>`;
  }

  // ── Upload Modal ───────────────────────────────────────────────────────────
  function UploadModal({ onClose, onSuccess, typeOpts }) {
    const [file, setFile]         = useState(null);
    const [client, setClient]     = useState("");
    const [docType, setDocType]   = useState(typeOpts[0] || "");
    const [custom, setCustom]     = useState("");
    const [drag, setDrag]         = useState(false);
    const [busy, setBusy]         = useState(false);
    const fileRef                 = useRef(null);

    useEffect(() => { if (!docType && typeOpts.length > 0) setDocType(typeOpts[0]); }, [typeOpts]);

    function handleDrop(e) { e.preventDefault(); setDrag(false); const f = e.dataTransfer.files[0]; if (f) setFile(f); }

    async function submit() {
      const eff = docType === "__custom__" ? custom.trim() : docType;
      if (!file || !client.trim() || !eff) return;
      setBusy(true);
      try { onSuccess(await api.uploadDocument(file, client.trim(), eff)); }
      catch (err) { alert("Upload failed: " + err.message); }
      finally { setBusy(false); }
    }

    const fmtB = b => b<1024?`${b} B`:b<1048576?`${(b/1024).toFixed(1)} KB`:`${(b/1048576).toFixed(1)} MB`;
    const ready = file && client.trim() && (docType!=="__custom__" ? !!docType : !!custom.trim());

    return html`
      <div className="modal-bg" onClick=${e => e.target.className==="modal-bg" && onClose()}>
        <div className="modal">
          <div className="modal-head">
            <div className="modal-title">${I.upload(14)} Upload Completed Document</div>
            <button className="modal-close" onClick=${onClose}>${I.x(13)}</button>
          </div>

          <div className="modal-body">
            ${file ? html`
              <div className="sel-file">
                ${I.doc(15)}
                <span className="sel-file-name">${file.name}</span>
                <span className="sel-file-size">${fmtB(file.size)}</span>
                <span className="rm-file" onClick=${() => setFile(null)}>${I.x(12)}</span>
              </div>
            ` : html`
              <div
                className=${"drop-zone"+(drag?" drag":"")}
                onClick=${() => fileRef.current.click()}
                onDragOver=${e => { e.preventDefault(); setDrag(true); }}
                onDragLeave=${() => setDrag(false)}
                onDrop=${handleDrop}
              >
                <div className="drop-ico">${I.upload(20)}</div>
                <div className="drop-text">Drag & drop your document here</div>
                <div className="drop-sub">or click to browse — .docx, .pdf, .xlsx, .pptx, .doc</div>
                <input ref=${fileRef} type="file" style=${{ display:"none" }}
                  accept=".docx,.pdf,.xlsx,.pptx,.doc,.txt"
                  onChange=${e => setFile(e.target.files[0])} />
              </div>
            `}

            <div className="field">
              <label>Client / Project Name *</label>
              <input type="text" placeholder="e.g. Project Alpha"
                value=${client} onChange=${e => setClient(e.target.value)} />
            </div>

            <div className="field">
              <label>Document Type *</label>
              <select value=${docType} onChange=${e => setDocType(e.target.value)}>
                ${typeOpts.length > 0
                  ? typeOpts.map(t => html`<option key=${t} value=${t}>${dispType(t)}</option>`)
                  : html`<option value="">— No templates loaded —</option>`
                }
                <option value="__custom__">Other (custom type)</option>
              </select>
            </div>

            ${docType==="__custom__" && html`
              <div className="field">
                <label>Custom Document Type *</label>
                <input type="text" placeholder="e.g. UAT Test Plan"
                  value=${custom} onChange=${e => setCustom(e.target.value)} />
              </div>
            `}
          </div>

          <div className="modal-footer">
            <button className="btn btn-ghost" onClick=${onClose}>Cancel</button>
            <button className="btn btn-primary" onClick=${submit} disabled=${!ready || busy}>
              ${busy ? "Uploading…" : "Store Document"}
            </button>
          </div>
        </div>
      </div>`;
  }

  // ── Toast ──────────────────────────────────────────────────────────────────
  function Toast({ msg, type, onDone }) {
    useEffect(() => { const t = setTimeout(onDone, 3500); return () => clearTimeout(t); }, [onDone]);
    return html`
      <div className=${"toast "+type}>
        <span className="toast-ico">${type==="success" ? I.check(13) : I.alert(13)}</span>
        ${msg}
      </div>`;
  }

  // ── App ────────────────────────────────────────────────────────────────────
  function App() {
    const [messages, setMessages]   = useState([]);
    const [input, setInput]         = useState("");
    const [typing, setTyping]       = useState(false);
    const [sessionId, setSess]      = useState(null);
    const [showUpload, setUpload]   = useState(false);
    const [showCmd, setCmd]         = useState(false);
    const [toast, setToast]         = useState(null);
    const [templates, setTemplates] = useState([]);
    const [tplLoading, setTplLoad]  = useState(false);
    const [recent, setRecent]       = useState([]);

    const scrollRef = useRef(null);
    const inputRef  = useRef(null);

    useEffect(() => {
      if (scrollRef.current)
        scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }, [messages, typing]);

    useEffect(() => { loadTemplates(); }, []);

    useEffect(() => {
      function onKey(e) {
        if ((e.ctrlKey||e.metaKey) && e.key==="k") { e.preventDefault(); setCmd(c => !c); }
      }
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, []);

    async function loadTemplates() {
      setTplLoad(true);
      try {
        const data = await api.getTemplates();
        const list = Array.isArray(data) ? data : Array.isArray(data.templates) ? data.templates : [];
        setTemplates(list);
      } catch (err) {
        console.error("Failed to load templates:", err);
        notify("Could not load templates from backend", "error");
      } finally { setTplLoad(false); }
    }

    const typeOpts = useMemo(
      () => [...new Set(templates.map(t => t.document_type).filter(Boolean))],
      [templates]
    );
    const quickTpls = useMemo(() => typeOpts.slice(0, 3), [typeOpts]);

    function notify(msg, type="success") { setToast({ msg, type }); }

    function buildHistory() {
      return messages.slice(-12).map(m => ({ role: m.role, content: m.content }));
    }

    async function sendMessage(text) {
      if (!text.trim()) return;
      setMessages(prev => [...prev, { role:"user", content:text, timestamp:new Date().toISOString() }]);
      setInput("");
      setTyping(true);
      try {
        const data = await api.chat(text, buildHistory(), sessionId);
        if (!sessionId && data.session_id) setSess(data.session_id);
        setMessages(prev => [...prev, {
          role:"assistant", content: data.message||"Done.",
          action: data.action, download_url: data.download_url,
          document_type: data.document_type,
          templates: data.available_templates||[],
          clients:   data.clients||[],
          timestamp: new Date().toISOString(),
        }]);
      } catch (err) {
        setMessages(prev => [...prev, {
          role:"assistant",
          content:`**Connection error**: ${err.message}\n\nMake sure the backend is running on port 8000.`,
          timestamp: new Date().toISOString(),
        }]);
      } finally { setTyping(false); }
    }

    function onKeyDown(e) {
      if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(input); }
    }

    function onTplDl(tpl) {
      const url = resolveUrl(tpl.download_url || `/api/templates/download/${encodeURIComponent(tpl.filename)}`);
      window.open(url, "_blank");
      notify(`Downloading ${dispType(tpl.document_type||tpl.name)} template…`);
    }

    function onUploadSuccess(result) {
      setUpload(false);
      const doc = result.document || result;
      const cl  = doc.client_name || doc.project_name || "Unknown";
      const dt  = dispType(doc.document_type || "Document");
      const fn  = doc.filename || "uploaded-file";
      notify(`Stored for ${cl} / ${dt}`);
      setMessages(prev => [...prev, {
        role:"assistant",
        content:`**Document stored successfully!**\n\nSaved under \`${cl}/${dt}/\`\n\nFile: \`${fn}\`\n\nIs there anything else you need?`,
        timestamp: new Date().toISOString(),
      }]);
    }

    function cmdSend(msg, item) {
      if (item) setRecent(prev => [item, ...prev.filter(a => a.id!==item.id)].slice(0,4));
      sendMessage(msg);
    }

    function clearChat() { setMessages([]); setSess(null); }

    const hasMsgs = messages.length > 0;

    return html`
      <div className="app">

        <!-- Sidebar -->
        <aside className="sidebar">
          <div className="sidebar-head">
            <div className="logo-mark">${I.doc(15)}</div>
            <div>
              <div className="logo-name">MarBot</div>
              <div className="logo-sub">PM Document Assistant</div>
            </div>
          </div>

          <${SidebarNav} onSend=${sendMessage} onUpload=${() => setUpload(true)} />

          <div className="sb-label">Quick Fetch</div>
          <div className="pill-row">
            ${typeOpts.length > 0
              ? typeOpts.map(t => html`
                  <button key=${t} className="pill"
                    onClick=${() => sendMessage(dispType(t))}>
                    ${dispType(t)}
                  </button>
                `)
              : html`<span style=${{ fontSize:"11px", color:"var(--sidebar-muted)", padding:"0 4px" }}>
                  ${tplLoading ? "Loading…" : "No templates"}
                </span>`
            }
          </div>

          <div className="sb-spacer"></div>

          <div className="sb-foot">
            <button className="sb-foot-btn" onClick=${clearChat}>
              ${I.refresh(12)} New Chat
            </button>
          </div>
        </aside>

        <!-- Chat -->
        <main className="chat-area">
          <div className="topbar">
            <div className="topbar-brand">
              <span className="topbar-title">PM Document Assistant</span>
              <div className="topbar-sep"></div>
              <span className="topbar-badge">AI-Powered</span>
            </div>

            <button className="cmd-trigger" onClick=${() => setCmd(true)}>
              ${I.search(13)}
              <span className="cmd-trigger-text">Search or run a command…</span>
              <span className="cmd-shortcut">Ctrl K</span>
            </button>

            <div className="topbar-actions">
              <button className="ico-btn" onClick=${() => setUpload(true)} title="Upload document">
                ${I.upload(13)}
              </button>
              <button className="ico-btn" onClick=${clearChat} title="New chat">
                ${I.refresh(13)}
              </button>
            </div>
          </div>

          <div className="msgs" ref=${scrollRef}>
            ${!hasMsgs && html`
              <div className="welcome">
                <div className="welcome-mark">${I.doc(26)}</div>
                <h1 className="welcome-title">MarBot PM Assistant</h1>
                <p className="welcome-sub">
                  Manage project documents in one place. Fetch templates,
                  upload completed docs, and browse client files — all through chat.
                </p>
                <div className="quick-grid">
                  ${quickTpls.map(t => html`
                    <button key=${t} className="quick-btn" onClick=${() => sendMessage(dispType(t))}>
                      <div className="quick-btn-icon">${docIcon(t, 14)}</div>
                      <span className="quick-btn-label">Fetch ${dispType(t)}</span>
                      <span className="quick-btn-desc">Download template</span>
                    </button>
                  `)}
                  <button className="quick-btn" onClick=${() => sendMessage("list clients")}>
                    <div className="quick-btn-icon">${I.users(14)}</div>
                    <span className="quick-btn-label">List Clients</span>
                    <span className="quick-btn-desc">View stored documents</span>
                  </button>
                  <button className="quick-btn" onClick=${() => setUpload(true)}>
                    <div className="quick-btn-icon">${I.upload(14)}</div>
                    <span className="quick-btn-label">Upload Document</span>
                    <span className="quick-btn-desc">Store a completed doc</span>
                  </button>
                </div>
              </div>
            `}

            ${messages.map((m,i) => html`
              <${MsgBubble}
                key=${i} msg=${m}
                onTplDl=${onTplDl}
                onUpload=${() => setUpload(true)}
              />
            `)}

            ${typing && html`<${TypingIndicator} />`}
          </div>

          <div className="input-area">
            <div className="input-row">
              <textarea
                ref=${inputRef}
                className="chat-input" rows="1"
                placeholder="Ask me to fetch a template, list clients, or upload a document…"
                value=${input}
                onInput=${e => {
                  setInput(e.target.value);
                  e.target.style.height = "auto";
                  e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
                }}
                onKeyDown=${onKeyDown}
              ></textarea>
              <div className="input-actions">
                <button className="attach-btn" onClick=${() => setUpload(true)} title="Upload">
                  ${I.clip(13)}
                </button>
                <button className="send-btn" onClick=${() => sendMessage(input)}
                  disabled=${!input.trim()||typing} title="Send">
                  ${I.send(13)}
                </button>
              </div>
            </div>
            <div className="input-hint">Enter to send · Shift+Enter for new line · Ctrl+K for commands</div>
          </div>
        </main>

        <!-- Command Palette -->
        <${CmdPalette}
          open=${showCmd}
          onClose=${() => setCmd(false)}
          onSend=${cmdSend}
          onUpload=${() => { setCmd(false); setUpload(true); }}
          recent=${recent}
        />

        ${showUpload && html`
          <${UploadModal}
            onClose=${() => setUpload(false)}
            onSuccess=${onUploadSuccess}
            typeOpts=${typeOpts}
          />`}

        ${toast && html`
          <${Toast} msg=${toast.msg} type=${toast.type} onDone=${() => setToast(null)} />`}
      </div>`;
  }

  createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
