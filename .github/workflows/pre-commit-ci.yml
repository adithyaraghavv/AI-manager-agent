name: pre-commit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      # Soft-launch: existing codebase has pre-existing style/format drift
      # that these hooks will fix on first run. Report violations as PR
      # annotations without blocking merges. Remove continue-on-error after
      # the codebase-wide "chore: apply pre-commit auto-fixes" cleanup PR
      # lands. Tracking: https://github.com/Marlabs-Innovations-Private-Limited/RAG-agent/issues (open one before flipping this).
      - name: Run pre-commit on all files
        continue-on-error: true
        run: pre-commit run --all-files --show-diff-on-failure
