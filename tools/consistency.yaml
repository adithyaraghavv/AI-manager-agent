#     `astral-sh/setup-uv@v3` resolves to. Enable once a single uv version is
#     pinned across Dockerfile + CI setup step.
#
#   python_requires_pyproject:
#     `backend/pyproject.toml` declares `requires-python = ">=3.11"` while the
#     Dockerfile pins 3.13. These aren't strictly inconsistent (>=3.11 admits
#     3.13) but a stricter rule could require the floor to match the CI matrix
#     minimum. Deferred pending a decision on the supported floor.
#
#   node_engines_frontend:
#     `frontend/package.json` does not currently declare an `engines.node`
#     field. Once added, enforce it equals the workflow `node-version`.
