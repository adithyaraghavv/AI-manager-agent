# Local dev stack for the RAG agent.
#
#   make up          # start everything
#   make logs        # follow logs
#   make down        # stop
#
# Production deploys are handled by azure-pipelines.yml + docker-compose.prod.yml
# (see deploy/ansible); this file is for local development only.
#
# No local Postgres/migrations service here — the running app talks to
# Supabase over its REST API (SUPABASE_URL / SUPABASE_KEY in
# backend/.env.dev), not a direct Postgres connection, in every
# environment including local dev. A local pgvector container never held
# the real data anyway, so running Alembic against one was never actually
# migrating anything meaningful — cleaned up rather than kept as
# unused-but-harmless.
#
# Modern docker compose ignores the top-level `version:` key, so it is
# omitted intentionally.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # .env.dev.example is the checked-in template (placeholder values only,
    # e.g. OPENAI_API_KEY=sk-replace-me) — it exists so `docker compose up`
    # never fails with "file not found" on a fresh clone. backend/.env.dev
    # is your own untracked copy with real keys (`copy
    # backend\.env.dev.example backend\.env.dev`, then fill it in); loaded
    # second so its real values override the placeholders above it.
    env_file:
      - backend/.env.dev.example
      - backend/.env.dev
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # "localhost" inside this container means "this container", not the
      # backend one — use the compose service name instead. See
      # frontend/vite.config.js for the other half of this.
      BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
