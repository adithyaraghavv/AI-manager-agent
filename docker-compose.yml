# Local dev stack for the RAG agent.
#
#   make up          # start everything
#   make logs        # follow logs
#   make down        # stop
#
# Production deploys are handled by azure-pipelines.yml + docker-compose.prod.yml
# (see deploy/ansible); this file is for local development only.
#
# No local Postgres/migrations service here — the running app talks to
# Supabase over its REST API (SUPABASE_URL / SUPABASE_KEY in
# backend/.env.dev.example), not a direct Postgres connection, in every
# environment including local dev. A local pgvector container never held
# the real data anyway, so running Alembic against one was never actually
# migrating anything meaningful — cleaned up rather than kept as
# unused-but-harmless.
#
# Modern docker compose ignores the top-level `version:` key, so it is
# omitted intentionally.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - backend/.env.dev.example
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
